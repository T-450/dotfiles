# llama.cpp user defaults for this ThinkPad T14 (i5-10310U: 4 physical cores, 16 GiB RAM,
# Intel UHD Graphics 620 via ggml-vulkan + vulkan-intel). Automatically read by llama-cli and
# llama-server from $XDG_CONFIG_HOME/llama.cpp/config.ini; explicit CLI flags override it.
[*]
threads = 4
ctx-size = 8192
n-gpu-layers = auto
flash-attn = on
load-mode = auto
