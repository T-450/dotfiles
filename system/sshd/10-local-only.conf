# sshd for runner-up only (CI coordinator reaching this machine's agent as user@localhost).
# Loopback only, keys only: runner-up's KVM job VMs can reach the host's loopback at 10.0.2.2,
# so password and keyboard-interactive logins stay off. First match wins, so this file (10-)
# overrides Arch's 99-archlinux.conf.
ListenAddress 127.0.0.1
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
