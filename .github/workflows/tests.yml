# Clean-install proof on every push: a fresh Arch VM (runner-up KVM place, pool arch-kvm)
# runs bootstrap.sh, then install.sh again (it must change nothing), --check and the test suite.
name: tests
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  workflow_dispatch:
env:
  # identity tags ({{git_name}}, {{git_email}}) for the VM; on a real machine they come from your
  # git config or a prompt
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
defaults:
  run:
    shell: bash # = bash -eo pipefail: a failing install.sh must fail the step even through `| tee`
jobs:
  clean-install:
    runs-on: arch-kvm
    timeout-minutes: 120
    steps:
      - name: Guest
        run: |
          cat /etc/os-release | head -2; id; nproc; free -m | head -2
          sudo -n true && echo "sudo: ok"
          sudo pacman -Syu --needed --noconfirm git
      - uses: actions/checkout@v5
      - name: bootstrap.sh (fresh machine)
        run: ./bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/first.log"
      - name: install.sh again (idempotent)
        run: |
          ./install.sh 2>&1 | tee "$RUNNER_TEMP/second.log"
          if grep -E '^(install |backup|unlink|prune|enable |gsettings|render |linger|xdg )' "$RUNNER_TEMP/second.log"; then
            echo "::error::the second run changed something"; exit 1
          fi
      - name: install.sh --check
        run: ./install.sh --check
      - name: tests/run
        run: tests/run
