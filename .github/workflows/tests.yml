# Clean-install proof on every push: a fresh Arch VM (runner-up KVM place, pool arch-kvm)
# runs install.sh twice (the second run must change nothing) and then the test suite.
name: tests
on:
  push:
  workflow_dispatch:
jobs:
  clean-install:
    runs-on: arch-kvm
    timeout-minutes: 120
    steps:
      - name: Guest
        run: |
          cat /etc/os-release | head -2; id; nproc; free -m | head -2
          sudo -n true && echo "sudo: ok"
          sudo pacman -Syu --needed --noconfirm git
      - uses: actions/checkout@v4
      - name: install.sh (clean machine)
        run: ./install.sh 2>&1 | tee "$RUNNER_TEMP/first.log"
      - name: install.sh again (idempotent)
        run: |
          ./install.sh 2>&1 | tee "$RUNNER_TEMP/second.log"
          if grep -E '^(install|backup|unlink|prune|linked |enable |remove |gsettings|theme  )' "$RUNNER_TEMP/second.log"; then
            echo "::error::the second run changed something"; exit 1
          fi
      - name: tests/run
        run: tests/run
