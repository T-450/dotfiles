# Clean-install proof on every push: a fresh Arch VM (runner-up KVM place, pool arch-kvm)
# runs bootstrap.sh, then install.sh again (it must change nothing), --check and the test suite.
name: tests
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  # identity tags ({{git_name}}, {{git_email}}) for the VM; on a real machine they come from your
  # git config or a prompt
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
defaults:
  run:
    shell: bash # = bash -eo pipefail: a failing install.sh must fail the step even through `| tee`
jobs:
  clean-install:
    runs-on: arch-kvm
    timeout-minutes: 120
    steps:
      - name: Guest
        run: |
          cat /etc/os-release | head -2; id; nproc; free -m | head -2
          sudo -n true && echo "sudo: ok"
          sudo pacman -Syu --needed --noconfirm git
      - uses: actions/checkout@v5
      - name: bootstrap.sh (fresh machine)
        env:
          # mise's GitHub API calls (provenance, release lookups); the anonymous limit is shared by
          # every VM behind this laptop's IP. Only the steps that install get the token.
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/first.log"
      - name: install.sh again (idempotent)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./install.sh 2>&1 | tee "$RUNNER_TEMP/second.log"
          if grep -E '^(install |backup|unlink|prune|enable |gsettings|render |linger|xdg |rebuild )' "$RUNNER_TEMP/second.log"; then
            echo "::error::the second run changed something"; exit 1
          fi
      - name: install.sh --check
        run: ./install.sh --check
      - name: toolchain versions
        run: mise -C / ls --global --json | jq -S 'map_values(map(.version))'
      - name: tests/run
        # the step's bash has no zsh hooks: mise exec puts the global tools' absolute bin dirs on
        # PATH, which survive the tests' scratch HOME. -C changes the working directory, so the
        # path is absolute. Auto-install off: a missing tool fails instead of installing unlocked.
        env:
          MISE_AUTO_INSTALL: "0"
          MISE_EXEC_AUTO_INSTALL: "0"
        run: mise -C / exec -- "$PWD/tests/run"
