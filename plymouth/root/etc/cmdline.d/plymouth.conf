# The boot splash (plymouth/) on the kernel command line of the unified kernel images (UKIs, mkinitcpio's
# presets): mkinitcpio adds /etc/cmdline.d/*.conf after this machine's /etc/kernel/cmdline (root=...).
# splash: Plymouth draws its theme instead of boot messages; quiet loglevel=3: no kernel messages over it.
quiet loglevel=3 splash
