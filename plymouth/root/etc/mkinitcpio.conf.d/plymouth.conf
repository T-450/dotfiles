# The boot splash (plymouth/): the HOOKS of /etc/mkinitcpio.conf with plymouth right after udev,
# where Plymouth needs it. mkinitcpio reads this drop-in after mkinitcpio.conf, so this list wins
# and that file stays as installed. plymouth/setup.sh rebuilds the images when this file changes.
HOOKS=(base udev plymouth autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)
