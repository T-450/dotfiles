# Session env for mango and its children (reset on reload, relogin to change).
# Only DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XCURSOR_THEME
# XCURSOR_SIZE MANGO_INSTANCE_SIGNATURE are imported into systemd units;
# unit-only vars live in environment.d/10-wayland.conf.
env=XDG_SESSION_TYPE,wayland
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
# Qt follows the portal's color-scheme (dark/light from the palette); Fusion style
env=QT_QPA_PLATFORMTHEME,xdgdesktopportal
env=ELECTRON_OZONE_PLATFORM_HINT,auto
# opencode merges this over its cli.json, which it rewrites by rename, so the repo can't link it
env=OPENCODE_CLI_CONFIG_CONTENT,{"theme":{"name":"mango"}}
