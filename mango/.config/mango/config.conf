# Effect
# mango 0.18.5 gates layer blur on blur=1 and layer shadows on shadows=1:
# blur_layer and layer_shadows do nothing alone
blur=0
blur_layer=0

shadows=1
layer_shadows = 1
shadow_only_floating=1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration
var=anim_ms,150
var=ease_out_quad,0.5,1,0.89,1
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
# mango 0.18.5 silently raises zoom_initial_ratio below 0.1 to 0.1
zoom_initial_ratio=0.1
zoom_end_ratio=0.6
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.6
animation_duration_move=$anim_ms
animation_duration_open=$anim_ms
animation_duration_tag=$anim_ms
animation_duration_close=$anim_ms
animation_duration_focus=$anim_ms
animation_curve_open=$ease_out_quad
animation_curve_move=$ease_out_quad
animation_curve_tag=$ease_out_quad
animation_curve_close=$ease_out_quad
animation_curve_focus=$ease_out_quad
animation_curve_opacity_fade_out=$ease_out_quad
animation_curve_opacity_fade_in=$ease_out_quad

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
smart_gaps=0
default_master_factor=0.55
default_master_count=1

#Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=1
sync_obj_enable=1
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,scroller
enable_floating_snap=1
snap_distance=50
cursor_size=22
cursor_theme=Adwaita
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# keyboard
repeat_rate=40
repeat_delay=300
numlock_on=1
xkb_rules_layout=us
xkb_rules_options=caps:escape

# Trackpad
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0

# Appearance
# no gaps: tiled windows meet edge to edge, like tmux or Neovim panes; the border marks focus
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
# tmux line: 3px on every window (mango has one width for all); the focused one takes the focus hue
border_px=3
dim_enable=0
# tab bar (monocle/deck tab mode, groups) follows the border: same line width and corners
tab_bar_decorate_border_width=3
tab_bar_decorate_corner_radius=0

# sub config load
# colors.conf is rendered from the active palette by theme/theme (theme set NAME)
source=./colors.conf
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# Autostart: session daemons are systemd user units bound to graphical-session.target
# (each app's .config/systemd/user/, enabled by install.sh). Mango imports the env and starts
# mango-session.target itself; do not add dbus-update-activation-environment here.

