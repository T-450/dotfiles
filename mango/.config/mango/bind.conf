# Keybindings. `mango-keys` (super+/) shows them as a rofi cheatsheet: a `## ` line starts a
# section, a `#: ` line describes the bind below it (binds without one are described from their
# action). docs/keybindings.md lists the everyday ones.

# variables (define before use; shared across sourced files)
var=term,ghostty
var=launcher,rofi -show drun
var=locker,pidof -q swaylock || swaylock -f
var=browser,firefox

## Apps
#: Terminal (Ghostty)
bind=Alt,Return,spawn,$term
#: Dropdown terminal: a persistent shell; Alt+Esc hides it
bind=ALT,Escape,toggle_named_scratchpad,com.mitchellh.ghostty-dropdown,none,ghostty --class=com.mitchellh.ghostty-dropdown
#: Floating terminal: a throwaway window; Super+Shift+Q closes it
bind=ALT+SHIFT,t,spawn,$term --class=com.mitchellh.ghostty-float
#: Browser (Firefox)
bind=SUPER,Return,spawn,$browser
#: File manager (Thunar)
bind=SUPER,f,spawn,thunar
#: App launcher
bind=SUPER,d,spawn_shell,$launcher
#: Clipboard history
bind=SUPER,v,spawn,~/.local/bin/clip
#: Keybindings (this list)
bind=SUPER,slash,spawn,~/.local/bin/mango-keys
#: Theme picker
bind=SUPER+SHIFT,t,spawn,~/.local/bin/theme pick
#: Wallpaper picker (waypaper)
bind=SUPER,w,spawn,waypaper
#: Screenshot of a region
bind=CTRL+ALT,a,spawn,~/.local/bin/screenshot region
#: Screenshot of the screen
bind=none,Print,spawn,~/.local/bin/screenshot full
#: Start/stop screen recording
bind=CTRL+ALT,r,spawn,~/.local/bin/gpurecord toggle

## Session
#: Lock screen
bind=CTRL+ALT,l,spawn_shell,$locker
#: Power menu
# super+shift+esc, not super+esc: one slip from alt+esc (the dropdown) would open it, and its
# single-letter keys (d shuts down, r reboots, ...) would then act on whatever you type next
bind=SUPER+SHIFT,Escape,spawn,wlogout -b 6 --protocol layer-shell
#: Log out
bind=SUPER,m,spawn,~/.local/bin/mango-quit
bind=SUPER,r,reload_config
#: Show/hide the bar
bind=SUPER,b,spawn,~/.local/bin/waybar-toggle
#: Laptop panel on/off
bind=SUPER,p,spawn,~/.local/bin/mango-monitor

## Windows: focus
# vim keys; alt+arrows stay with apps (Firefox back/forward, helix's syntax-tree moves)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Tab,overcircle,next
bind=ALT,Tab,togglejump
bind=SUPER+shift,n,focusstack,next
bind=SUPER,u,focuslast

## Windows: move and resize
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
# No keyboard nudge/resize (movewin, resizewin): their old keys, ctrl+shift+arrows and
# ctrl+alt+arrows, are word selection in every text field and Ghostty's tab, prompt and split
# keys, and both actions float a tiled window. super+drag moves, super+right-drag resizes.

## Windows: state
bind=SUPER+SHIFT,q,killclient,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

## Layouts
# one key per action: circle_layout has only tile and scroller, so super+n reaches both
bind=SUPER,n,switch_layout
bind=SUPER,e,incnmaster,1
bind=SUPER,t,incnmaster,-1
bind=ALT,s,zoom,
# cycles scroller_proportion_preset (0.5, 0.8, 1.0)
bind=ALT,x,switch_proportion_preset,
# up/down stacking and dwindle's split keys act only in the vertical scroller and dwindle,
# which neither circle_layout nor tag.conf uses, so they have no keys
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right

## Tags
# dwm's layout: super+N shows tag N, +shift moves the window there, +ctrl adds the tag to the
# view, +ctrl+shift adds the window to it. ctrl+N and alt+N stay with apps (tab switching).
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9
bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
# ctrl+left/right stay word jumps in apps; 4-finger swipes go to the previous/next tag with windows
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

## Monitors
# left/right only: the monitors sit side by side (monitor.conf), and up/down wrap to the same one
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

## Notifications
#: Restore the last notification
bind=CTRL+ALT,backslash,spawn,makoctl restore
#: Dismiss all notifications
bind=CTRL+ALT,BackSpace,spawn,makoctl dismiss --all
#: Do not disturb on/off
bind=CTRL+ALT+SHIFT,backslash,spawn,makoctl mode -t do-not-disturb

## Media and brightness
# bindl = also works while locked; OSD via swayosd
#: Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.local/bin/osd-volume up
#: Volume down
bindl=NONE,XF86AudioLowerVolume,spawn,~/.local/bin/osd-volume down
#: Mute
bindl=NONE,XF86AudioMute,spawn,~/.local/bin/osd-volume mute
#: Mute the microphone
bindl=NONE,XF86AudioMicMute,spawn,~/.local/bin/osd-volume micmute
#: Brightness up
bindl=NONE,XF86MonBrightnessUp,spawn,~/.local/bin/osd-brightness up
#: Brightness down
bindl=NONE,XF86MonBrightnessDown,spawn,~/.local/bin/osd-brightness down
#: Play/pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
#: Next track
bindl=NONE,XF86AudioNext,spawn,playerctl next
#: Previous track
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

## Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# One bind per action: close, maximize, fullscreen, minimize, scroller widths, focus and swapping
# have keys, so the mouse only drags. Never bind a bare click: mango takes every click a
# mousebind matches, so apps would lose paste and open-in-tab.

## Touchpad
# 3-finger swipes are free: focus is super+h/j/k/l
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
