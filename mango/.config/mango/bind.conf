# Keybindings: a few chords for the hot path, everything else behind a leader (super+space), one
# group per key mode. Design: docs/designs/keybindings.md.
#
# `mango-keys` (super+/) reads this file: a `## ` line starts a group (the chip and card title), a
# `#: ` line describes the bind below it, and text after ` ~ ` in it is extra search words.
# A one-shot operation in a mode is two `bindc` lines on one key: the action, then
# `setkeymode,default` (it ends the chain, so it is always last). Keys a mode doesn't bind reach
# the focused app, so every mode binds Escape.

# variables (define before use; shared across sourced files)
var=term,ghostty
var=launcher,rofi -show drun
var=locker,pidof -q swaylock || swaylock -f
var=browser,firefox

## Focus
# vim keys; alt+arrows stay with apps (Firefox back/forward, helix's syntax-tree moves)
#: Focus left ~ window
bind=SUPER,h,focusdir,left
#: Focus down ~ window
bind=SUPER,j,focusdir,down
#: Focus up ~ window
bind=SUPER,k,focusdir,up
#: Focus right ~ window
bind=SUPER,l,focusdir,right
#: Move window left ~ swap
bind=SUPER+SHIFT,h,move_client,left
#: Move window down ~ swap
bind=SUPER+SHIFT,j,move_client,down
#: Move window up ~ swap
bind=SUPER+SHIFT,k,move_client,up
#: Move window right ~ swap
bind=SUPER+SHIFT,l,move_client,right
#: Overview, cycle windows ~ switcher expose
bind=SUPER,Tab,overcircle,next
#: Jump to a window by its hint ~ switcher
bind=ALT,Tab,togglejump
#: Previous window ~ last back
bind=SUPER,u,focuslast
#: Close window ~ kill quit exit
bind=SUPER+SHIFT,q,killclient,
#: Fullscreen ~ full screen big
bind=SUPER,f,togglefullscreen,

## Tags
# dwm's layout: super+N shows tag N, +shift moves the window there, +ctrl adds the tag to the
# view, +ctrl+shift adds the window to it. ctrl+N and alt+N stay with apps (tab switching).
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9
bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9
#: Previous tag ~ workspace left
bind=SUPER,Left,viewtoleft,0
#: Next tag ~ workspace right
bind=SUPER,Right,viewtoright,0
#: Carry window to the previous tag ~ move send workspace
bind=SUPER+SHIFT,Left,tagtoleft,0
#: Carry window to the next tag ~ move send workspace
bind=SUPER+SHIFT,Right,tagtoright,0

## Launch
#: Terminal (Ghostty) ~ shell console
bind=SUPER,Return,spawn,$term
#: App launcher ~ run menu drun
bind=SUPER,d,spawn_shell,$launcher
#: Dropdown terminal: a persistent shell; Alt+Esc hides it ~ quake scratchpad console
bind=ALT,Escape,toggle_named_scratchpad,com.mitchellh.ghostty-dropdown,none,ghostty --class=com.mitchellh.ghostty-dropdown
#: Keybindings (this cheatsheet) ~ help keys shortcuts
bind=SUPER,slash,spawn,~/.local/bin/mango-keys
#: Leader: every other group ~ menu which-key
bind=SUPER,space,setkeymode,leader

# common: in every mode. Media and brightness also work while locked (bindl); OSD via swayosd.
key_mode=common
## Media
#: Volume up ~ sound louder
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.local/bin/osd-volume up
#: Volume down ~ sound quieter
bindl=NONE,XF86AudioLowerVolume,spawn,~/.local/bin/osd-volume down
#: Mute ~ sound silence
bindl=NONE,XF86AudioMute,spawn,~/.local/bin/osd-volume mute
#: Mute the microphone ~ mic
bindl=NONE,XF86AudioMicMute,spawn,~/.local/bin/osd-volume micmute
#: Brightness up ~ screen backlight
bindl=NONE,XF86MonBrightnessUp,spawn,~/.local/bin/osd-brightness up
#: Brightness down ~ screen backlight
bindl=NONE,XF86MonBrightnessDown,spawn,~/.local/bin/osd-brightness down
#: Play/pause ~ music
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
#: Next track ~ music skip
bindl=NONE,XF86AudioNext,spawn,playerctl next
#: Previous track ~ music
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
## Capture
#: Screenshot of the screen ~ capture print grab
bind=NONE,Print,spawn,~/.local/bin/screenshot full
## Leader
#: Leave any key mode ~ cancel escape
bind=SUPER,Escape,setkeymode,default

key_mode=leader
## Leader
#: Apps ▸ ~ programs launch
bind=NONE,a,setkeymode,apps
bind=SUPER,a,setkeymode,apps
#: Window ▸
bind=NONE,w,setkeymode,window
bind=SUPER,w,setkeymode,window
#: Layout ▸
bind=NONE,l,setkeymode,layout
bind=SUPER,l,setkeymode,layout
#: Tag ▸ ~ workspace
bind=NONE,t,setkeymode,tag
bind=SUPER,t,setkeymode,tag
#: Monitor ▸ ~ display screen output
bind=NONE,m,setkeymode,monitor
bind=SUPER,m,setkeymode,monitor
#: Capture ▸ ~ screenshot record
bind=NONE,c,setkeymode,capture
bind=SUPER,c,setkeymode,capture
#: Notifications ▸ ~ mako
bind=NONE,n,setkeymode,notify
bind=SUPER,n,setkeymode,notify
#: Session ▸ ~ system power
bind=NONE,s,setkeymode,session
bind=SUPER,s,setkeymode,session
bind=SUPER,space,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=apps
## Apps
#: Browser (Firefox) ~ web internet
bindc=NONE,b,spawn,$browser
bindc=NONE,b,setkeymode,default
#: File manager (Thunar) ~ files folders explorer
bindc=NONE,f,spawn,thunar
bindc=NONE,f,setkeymode,default
#: Floating terminal: a throwaway window ~ shell console
bindc=NONE,t,spawn,$term --class=com.mitchellh.ghostty-float
bindc=NONE,t,setkeymode,default
#: Clipboard history ~ paste copy
bindc=NONE,v,spawn,~/.local/bin/clip
bindc=NONE,v,setkeymode,default
#: Wallpaper picker (waypaper) ~ background image
bindc=NONE,w,spawn,waypaper
bindc=NONE,w,setkeymode,default
#: Theme picker ~ palette colors colours
bindc=NONE,p,spawn,~/.local/bin/theme pick
bindc=NONE,p,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=window
## Window
#: Float/tile ~ floating tiled toggle
bindc=NONE,t,togglefloating,
bindc=NONE,t,setkeymode,default
#: Maximize ~ big zoom
bindc=NONE,m,togglemaximizescreen,
bindc=NONE,m,setkeymode,default
#: Fullscreen inside the tile ~ fake full screen
bindc=NONE,f,togglefakefullscreen,
bindc=NONE,f,setkeymode,default
#: Keep on top ~ overlay above
bindc=NONE,o,toggleoverlay,
bindc=NONE,o,setkeymode,default
#: Pin to all tags ~ sticky global
bindc=NONE,p,toggleglobal,
bindc=NONE,p,setkeymode,default
#: Center the floating window ~ middle
bindc=NONE,c,centerwin,
bindc=NONE,c,setkeymode,default
#: Minimize ~ hide
bindc=NONE,z,minimized,
bindc=NONE,z,setkeymode,default
#: Restore a minimized window ~ unhide unminimize
bindc=SHIFT,z,restore_minimized,
bindc=SHIFT,z,setkeymode,default
#: Show/hide minimized windows ~ scratchpad
bindc=NONE,s,toggle_scratchpad,
bindc=NONE,s,setkeymode,default
#: Force kill ~ close quit sigkill
bindc=SHIFT,q,killclient,force
bindc=SHIFT,q,setkeymode,default
#: Resize ▸ ~ size grow shrink
bind=NONE,r,setkeymode,resize
bind=NONE,Escape,setkeymode,default

key_mode=resize
## Resize
# sticky: keys repeat, Escape or Return ends it. On a tiled window resizewin moves the split.
#: Narrower ~ shrink width
bind=NONE,h,resizewin,-40,0
#: Shorter ~ shrink height
bind=NONE,k,resizewin,0,-40
#: Taller ~ grow height
bind=NONE,j,resizewin,0,40
#: Wider ~ grow width
bind=NONE,l,resizewin,40,0
#: Done ~ finish
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=layout
## Layout
#: Next layout ~ cycle switch
bindc=NONE,n,switch_layout
bindc=NONE,n,setkeymode,default
#: Tile ~ master stack
bindc=NONE,t,setlayout,tile
bindc=NONE,t,setkeymode,default
#: Scroller ~ columns niri
bindc=NONE,s,setlayout,scroller
bindc=NONE,s,setkeymode,default
#: Monocle ~ single one max
bindc=NONE,m,setlayout,monocle
bindc=NONE,m,setkeymode,default
#: Grid ~ tiles
bindc=NONE,g,setlayout,grid
bindc=NONE,g,setkeymode,default
#: Deck ~ stack cards
bindc=NONE,d,setlayout,deck
bindc=NONE,d,setkeymode,default
#: Swap with master ~ zoom promote
bindc=NONE,z,zoom,
bindc=NONE,z,setkeymode,default
#: More master windows ~ increase
bindc=NONE,equal,incnmaster,1
bindc=NONE,equal,setkeymode,default
#: Fewer master windows ~ decrease
bindc=NONE,minus,incnmaster,-1
bindc=NONE,minus,setkeymode,default
#: Cycle scroller widths (50, 80, 100%) ~ proportion size
bindc=NONE,w,switch_proportion_preset,next
bindc=NONE,w,setkeymode,default
#: Scroller: stack into the left column ~ join
bindc=NONE,bracketleft,scroller_stack,left
bindc=NONE,bracketleft,setkeymode,default
#: Scroller: stack into the right column ~ join
bindc=NONE,bracketright,scroller_stack,right
bindc=NONE,bracketright,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=tag
## Tag
#: Back to the previous tags ~ last toggle workspace
bindc=NONE,Tab,view,-1,0
bindc=NONE,Tab,setkeymode,default
#: Show all tags ~ every workspace
bindc=NONE,a,view,00,0
bindc=NONE,a,setkeymode,default
#: Next tag with windows ~ occupied workspace
bindc=NONE,n,viewtoright_have_client,0
bindc=NONE,n,setkeymode,default
#: Previous tag with windows ~ occupied workspace
bindc=NONE,p,viewtoleft_have_client,0
bindc=NONE,p,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=monitor
## Monitor
# left/right only: the monitors sit side by side (monitor.conf)
#: Focus the left monitor ~ display screen output
bindc=NONE,h,focusmon,left
bindc=NONE,h,setkeymode,default
#: Focus the right monitor ~ display screen output
bindc=NONE,l,focusmon,right
bindc=NONE,l,setkeymode,default
#: Send window to the left monitor ~ move display
bindc=SHIFT,h,tagmon,left
bindc=SHIFT,h,setkeymode,default
#: Send window to the right monitor ~ move display
bindc=SHIFT,l,tagmon,right
bindc=SHIFT,l,setkeymode,default
#: Laptop panel on/off ~ screen display internal
bindc=NONE,p,spawn,~/.local/bin/mango-monitor
bindc=NONE,p,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=capture
## Capture
#: Screenshot of a region ~ grab area selection
bindc=NONE,r,spawn,~/.local/bin/screenshot region
bindc=NONE,r,setkeymode,default
#: Start/stop screen recording ~ video record gpu
bindc=NONE,v,spawn,~/.local/bin/gpurecord toggle
bindc=NONE,v,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=notify
## Notifications
#: Restore the last notification ~ history show
bindc=NONE,r,spawn,makoctl restore
bindc=NONE,r,setkeymode,default
#: Dismiss all notifications ~ clear close
bindc=NONE,d,spawn,makoctl dismiss --all
bindc=NONE,d,setkeymode,default
#: Do not disturb on/off ~ dnd quiet silence
bindc=NONE,z,spawn,makoctl mode -t do-not-disturb
bindc=NONE,z,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=session
## Session
#: Lock screen ~ swaylock
bindc=NONE,l,spawn_shell,$locker
bindc=NONE,l,setkeymode,default
#: Log out ~ quit exit logout
bindc=NONE,e,spawn,~/.local/bin/mango-quit
bindc=NONE,e,setkeymode,default
#: Power menu ~ shutdown reboot suspend
bindc=NONE,p,spawn,wlogout -b 6 --protocol layer-shell
bindc=NONE,p,setkeymode,default
#: Reload mango's config ~ refresh restart
bindc=NONE,r,spawn,mmsg dispatch reload_config
bindc=NONE,r,setkeymode,default
#: Show/hide the bar ~ waybar panel
bindc=NONE,b,spawn,~/.local/bin/waybar-toggle
bindc=NONE,b,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=default
## Mouse
#: Drag a window ~ move
mousebind=SUPER,btn_left,moveresize,curmove
#: Resize a window ~ drag
mousebind=SUPER,btn_right,moveresize,curresize
# The mouse only drags: every other action has a key. Never bind a bare click: mango takes every
# click a mousebind matches, so apps would lose paste and open-in-tab.

## Touchpad
# 3-finger swipes are free: focus is super+h/j/k/l
#: Previous tag with windows ~ swipe workspace
gesturebind=none,right,4,viewprev_have_client
#: Next tag with windows ~ swipe workspace
gesturebind=none,left,4,viewnext_have_client
#: Overview ~ swipe expose
gesturebind=none,up,4,enteroverview
#: Leave overview ~ swipe
gesturebind=none,down,4,leaveoverview
