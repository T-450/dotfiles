# Monitor Rules (names/modes from `mmsg get all-monitors` / `wlr-randr`)

# ThinkPad T14: 1920x1080@60, scale 1
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,primary: 1
monitor_rule=name:^DP-2$,width:3840,height:2160,refresh:60,x:0,y:0,scale:1.0

hdr_depth=2

# 1.5 scale variant (also needs xorg-xrdb):
xwayland_ignore_scale=1
# monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.5
exec_once=sh -c 'echo "Xft.dpi: 144" | xrdb -merge'
