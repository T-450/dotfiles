# Display mode, scale, position and the lid rule belong to way-displays
# (~/.config/way-displays/cfg.yaml), so no monitor_rule here fights it on reload.
# Names/modes: `way-displays -g`, `wlr-randr`.

# XWayland apps draw themselves; Xft.dpi 120 matches the LG's scale 1.25 (needs xorg-xrdb).
xwayland_ignore_scale=1
exec_once=sh -c 'echo "Xft.dpi: 120" | xrdb -merge'

# Written by mango-monitor sync: disables the laptop panel across reloads while way-displays has it off.
source_optional=~/.local/state/mango/outputs.conf
