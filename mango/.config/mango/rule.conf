# Window Rules

# portal / file dialogs
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk
window_rule=animation_type_open:zoom,app_id:xdg-desktop-portal-gtk

# polkit agent
window_rule=is_floating:1,app_id:polkit-gnome-authentication-agent-1

# GTK apps (file manager, editor, archiver, bluetooth) open as 720x480 floating windows;
# firefox is GTK too but stays tiled (browser rules below), file and polkit dialogs keep their size
window_rule=is_floating:1,width:720,height:480,app_id:^([Tt]hunar|org\.xfce\.[Tt]hunar|org\.xfce\.mousepad|xarchiver|blueman-manager)$
# the wallpaper picker is open for a moment: it floats at its own default size instead of retiling
window_rule=is_floating:1,width:820,height:600,app_id:^waypaper$

# terminal
# app ids: com.mitchellh.ghostty, and -dropdown / -float for the two below (ghostty --class=)
window_rule=is_term:1,app_id:^com\.mitchellh\.ghostty
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^com\.mitchellh\.ghostty(-dropdown|-float)?$
# floating terminal (alt+shift+t): a new 800x600 window, centered
window_rule=is_floating:1,width:800,height:600,app_id:^com\.mitchellh\.ghostty-float$
# dropdown terminal (alt+esc): a named scratchpad on the top edge, half the screen tall. It is 80%
# wide like the alt+z scratchpad: mango shrinks a float as wide as the screen to 90% and centers it.
# offset_y is a percentage of the free space: -100 puts it against the top edge.
window_rule=is_named_scratchpad:1,width:0.8,height:0.5,offset_y:-100,app_id:^com\.mitchellh\.ghostty-dropdown$

# browser: only honours tiling size when (fake) maximized
window_rule=force_fake_maximize:1,app_id:firefox
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^firefox$
window_rule=force_fake_maximize:1,app_id:org.qutebrowser.qutebrowser

window_rule=no_swallow:1,title:Event Tester

# layer rules
# one rule per layer: in mango 0.18.5 every matching layer_rule also sets no_shadow, no_blur and
# no_animation (to 0 when unset), so a later rule for the same layer turns them back off
layer_rule=no_animation:1,layer_name:selection
layer_rule=no_animation:1,layer_name:dimland_layer
layer_rule=no_shadow:1,animation_type_open:fade,animation_type_close:fade,layer_name:notifications
# rofi's layer spans the screen above the bar and mango shadows a layer's whole surface,
# not what it draws, so the shadow would be a dark band over the bar
layer_rule=no_shadow:1,animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:swayosd
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:logout_dialog
