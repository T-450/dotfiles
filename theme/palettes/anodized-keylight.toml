# Anodized Keylight: the Quiet Instrument philosophy (an instrument sits dark and still, then says
# exactly what happened). The ground is anodised alloy: near-blacks with a faint violet cast, one
# step lighter per layer of depth (alloy 0-3), cool graphite borders, brushed aluminium text. Colour
# is a scarce currency, from light behind keycaps: one signal, the blue, for the single thing that
# matters (focus, cursor), the deep cobalt for the focused row; its neighbours on the same lit band
# have fixed jobs: cyan for routes and links, violet for time and its control. Green, amber and rose
# are outside the band, for outcomes only. Nothing else is saturated.
# Every text role reads at WCAG AA on alloy 0-3; fg_disabled (alloy 6) is the one exception.

[meta]
name = "Anodized Keylight"
variant = "dark"
source = "Anodized Keylight tokens (alloy, signal) and the Quiet Instrument philosophy"

[colors]
bg_desktop      = "#08070c"  # alloy-0, the ground
bg_surface      = "#100f16"  # alloy-1, panels
bg_widget       = "#18171f"  # alloy-2, raised panels: menus, notifications
bg_hover        = "#211f2a"  # alloy-3
border_hairline = "#2f2d3a"  # alloy-4: borders only where two regions would blur together
border_inactive = "#403d4d"  # alloy-5
fg_text         = "#b4b2bd"  # alloy-8, brushed aluminium
fg_editor       = "#b4b2bd"  # alloy-8
fg_secondary    = "#9f9caa"  # between alloy-7 and alloy-8: secondary facts recede
fg_muted        = "#8a8796"  # alloy-7, labels whisper
fg_bright       = "#ecebf0"  # alloy-9, primary facts
fg_disabled     = "#625f72"  # alloy-6
accent          = "#5b86f7"  # signal-blue: the one signal (focus border, cursor, ring)
badge           = "#9a86f4"  # signal-violet: time and its control
selection_bg    = "#21359c"  # signal-cobalt toward navy: the focused row (fg_text 4.9:1 on it)
selection_fg    = "#ecebf0"  # alloy-9
link            = "#5cdcec"  # signal-cyan: routes and links
error           = "#f2607e"  # rose
warning         = "#f4b862"  # amber
success         = "#5fe2a8"  # green
shadow          = "#000000"

[terminal]
fg     = "#b4b2bd"  # alloy-8
bg     = "#08070c"  # alloy-0
cursor = "#5b86f7"  # signal-blue
# the lit band (cyan, sky, blue, indigo, violet), the outcomes and the alloy greys; nothing else
ansi = [
	"#211f2a", "#f2607e", "#5fe2a8", "#f4b862", "#5b86f7", "#7779f5", "#5cdcec", "#b4b2bd",
	"#8a8796", "#f2607e", "#5fe2a8", "#e9cd80", "#93acfa", "#9a86f4", "#5bb2f6", "#ecebf0",
]

[keycaps]
# NuPhy Air60 HE (nuphy.com product photos): black modifier caps, grey letter caps, the violet
# accent caps, white legends, the aluminium frame, the amber sub-legends. Same on every palette:
# the cheatsheet looks like the keyboard. The violet caps are translucent on dark palettes (theme
# composites #rrggbbaa over bg_desktop); every legend must read at AA on its cap, or theme fails.
mod    = "#2e2e30"
cap    = "#626165"
accent = "#6a5bc7d9"  # translucent, like the board: 85% over the panel
legend = "#f2f2f2"
frame  = "#9d9d9d"
amber  = "#dcb04a"
