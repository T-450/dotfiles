# Anodized Keylight: the Quiet Instrument philosophy. An instrument sits dark and still until
# something real happens, then says exactly that. The ground is anodised alloy (alloy 0-9): near-blacks
# with a faint violet cast, one step lighter per layer of depth, brushed aluminium text. Exactly one
# signal, the lit key-face blue, with one job: focus and the single operation running now. Every other
# colour is a state and shows only while something is in it: cyan live (real time, the wall clock, a
# connection), violet held (virtual time, a clock that waits), green, amber, rose for success, pending,
# failure. No blends: no colour that exists only as a step between two others, so the selected row is a
# neutral alloy fill marked by the signal, not a tinted one. The signal and held hues sit at least
# 0.08 OKLCH from the stock indigo/violet/purple of generated interfaces. Every text role reads at AA on
# alloy 0-3, except held (4.35:1 on alloy-3: keep it on alloy 0-2) and fg_disabled (alloy-6).

[meta]
name = "Anodized Keylight"
variant = "dark"
source = "Anodized Keylight tokens (alloy, signal) and the Quiet Instrument philosophy"

[colors]
bg_desktop      = "#08070c"  # alloy-0, the ground
bg_surface      = "#100f16"  # alloy-1, panels
bg_widget       = "#18171f"  # alloy-2, raised panels: menus, notifications
bg_hover        = "#211f2a"  # alloy-3
border_hairline = "#2f2d3a"  # alloy-4: borders only where two regions would blur together
border_inactive = "#403d4d"  # alloy-5
fg_text         = "#b4b2bd"  # alloy-8, brushed aluminium
fg_editor       = "#b4b2bd"  # alloy-8
fg_secondary    = "#9f9caa"  # between alloy-7 and alloy-8: secondary facts recede
fg_muted        = "#8a8796"  # alloy-7, labels whisper
fg_bright       = "#ecebf0"  # alloy-9, primary facts
fg_disabled     = "#625f72"  # alloy-6
accent          = "#12a3fc"  # signal: focus and the one operation running now (5.9:1 on alloy-3)
badge           = "#a66ccb"  # held: virtual time, a clock that waits (4.8:1 on alloy-2)
selection_bg    = "#2f2d3a"  # alloy-4: the focused row is a neutral fill marked by the signal (fg_text 6.5:1)
selection_fg    = "#ecebf0"  # alloy-9
link            = "#5cdcec"  # live: real time, the wall clock, a connection, a link
error           = "#f2607e"  # rose
warning         = "#f4b862"  # amber
success         = "#5fe2a8"  # green
shadow          = "#000000"

[terminal]
fg     = "#b4b2bd"  # alloy-8
bg     = "#08070c"  # alloy-0
cursor = "#12a3fc"  # signal
# the signal, the two state hues, the three outcomes and the alloy greys; the bright slots repeat
# them (no extra hues)
ansi = [
	"#211f2a", "#f2607e", "#5fe2a8", "#f4b862", "#12a3fc", "#a66ccb", "#5cdcec", "#b4b2bd",
	"#8a8796", "#f2607e", "#5fe2a8", "#f4b862", "#12a3fc", "#a66ccb", "#5cdcec", "#ecebf0",
]

[keycaps]
# NuPhy Air60 HE (nuphy.com product photos): black modifier caps, grey letter caps, white legends,
# the aluminium frame. No lit key: the signal reads 2.45:1 under a white legend, and focus is the
# signal bar at the selected row's left edge, so the accent cap is the plain grey cap. Every legend
# must read at AA on its cap, or theme fails.
mod    = "#2e2e30"
cap    = "#626165"
accent = "#626165"  # the grey cap: focus is the row bar, not a lit key
legend = "#f2f2f2"
frame  = "#9d9d9d"
