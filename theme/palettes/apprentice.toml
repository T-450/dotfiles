# Apprentice: romainl/Apprentice (colortemplate/apprentice.colortemplate), a streamlining of
# Jeet Sukumaran's sorcerer into xterm colors. MIT license. Muted greys, an ocre status line,
# blue keywords. The comment on each role is the scheme's color name and the highlight group it
# comes from; "derived" marks a tier the scheme doesn't have. [terminal] is its own Term colors;
# [syntax] and [diff] are its highlight mapping, so every editor reads like it.

[meta]
name = "Apprentice"
variant = "dark"
source = "https://github.com/romainl/Apprentice"

[colors]
bg_desktop      = "#1c1c1c"  # almost_black (LineNr, ColorColumn)
bg_surface      = "#262626"  # darker_grey (Normal)
bg_widget       = "#303030"  # dark_grey (CursorLine)
bg_hover        = "#444444"  # grey (Pmenu, TabLineFill)
border_hairline = "#303030"  # dark_grey (CursorColumn)
border_inactive = "#585858"  # medium_grey (NonText, PmenuSbar)
fg_text         = "#bcbcbc"  # lighter_grey (Normal)
fg_editor       = "#bcbcbc"  # lighter_grey (Normal)
fg_secondary    = "#949494"  # derived: light_grey halfway to lighter_grey
fg_muted        = "#6c6c6c"  # light_grey (LineNr, Comment)
fg_bright       = "#ffffff"  # white
fg_disabled     = "#585858"  # medium_grey (NonText)
accent          = "#87875f"  # ocre (StatusLine, TabLineSel)
badge           = "#5f8787"  # aqua (PmenuSel)
selection_bg    = "#87afd7"  # light_blue (Visual)
selection_fg    = "#262626"  # darker_grey (Visual)
link            = "#5fafaf"  # light_aqua (Directory)
error           = "#af5f5f"  # red (ErrorMsg, WarningMsg)
warning         = "#ff8700"  # orange (SpellRare)
success         = "#87af87"  # light_green (ModeMsg, Question)
info            = "#5fafaf"  # light_aqua (SpellCap)
shadow          = "#000000"  # black

[terminal]
fg     = "#bcbcbc"
bg     = "#262626"
cursor = "#bcbcbc"
ansi = [
	"#1c1c1c", "#af5f5f", "#5f875f", "#87875f", "#5f87af", "#5f5f87", "#5f8787", "#6c6c6c",
	"#444444", "#ff8700", "#87af87", "#ffffaf", "#87afd7", "#8787af", "#5fafaf", "#ffffff",
]

[diff]
# DiffAdd, DiffDelete, DiffChange
add    = "#87afff"  # DiffAdd
remove = "#ffdf87"  # DiffDelete
change = "#dfdfdf"  # DiffChange

[syntax]
keyword    = "#87afd7"  # light_blue: Statement
preproc    = "#5f8787"  # aqua: PreProc
type       = "#8787af"  # light_purple: Type
function   = "#ffffaf"  # yellow: Function
identifier = "#5f87af"  # blue: Identifier
string     = "#87af87"  # light_green: String
constant   = "#ff8700"  # orange: Constant
number     = "#ff8700"  # orange: Number -> Constant
boolean    = "#ff8700"  # orange: Boolean -> Constant
special    = "#5f875f"  # green: Special
operator   = "#87afd7"  # light_blue: Operator -> Statement
comment    = "#6c6c6c"  # light_grey: Comment
