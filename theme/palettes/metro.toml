# Metro: COLOURlovers palette 1 "metro" by COLOURlover, CC BY-NC-SA 3.0 (credit COLOURlover; no
# commercial use; derivatives under the same license). Four colors: lovers gray (#515151), white,
# metro blue (#00b4ff), #eeeeee. Grey text on white with one blue. Every other tier is derived and
# marked so; metro blue reads 2.4:1 on white, so it stays a fill (badge, cursor) and the accent and
# links are it darkened. The terminal hues are picked and darkened to 4.5:1 (normal) and 3:1
# (bright) on white.

[meta]
name = "Metro"
variant = "light"
source = "https://www.colourlovers.com/palette/1/metro"

[colors]
bg_desktop      = "#eeeeee"  # #eeeeee
bg_surface      = "#ffffff"  # white
bg_widget       = "#ffffff"  # white
bg_hover        = "#dbdbdb"  # derived: #eeeeee, 12% toward lovers gray
border_hairline = "#dbdbdb"  # derived: #eeeeee, 12% toward lovers gray
border_inactive = "#bfbfbf"  # derived: #eeeeee, 30% toward lovers gray
fg_text         = "#515151"  # lovers gray
fg_editor       = "#515151"  # lovers gray
fg_secondary    = "#666666"  # derived: lovers gray, 12% toward white
fg_muted        = "#7c7c7c"  # derived: lovers gray, 25% toward white
fg_bright       = "#282828"  # derived: lovers gray, 50% toward black
fg_disabled     = "#b9b9b9"  # derived: lovers gray, 60% toward white
accent          = "#0090cc"  # derived: metro blue darkened to 3:1 on #eeeeee
badge           = "#00b4ff"  # metro blue
selection_bg    = "#b2e8ff"  # derived: metro blue, 70% toward white
selection_fg    = "#515151"  # lovers gray
link            = "#007eb2"  # derived: metro blue darkened to 4.5:1 on white
error           = "#cf4343"  # picked: red, 4.5:1
warning         = "#b88b00"  # picked: amber, 3:1
success         = "#2e8544"  # picked: green, 4.5:1
info            = "#007eb2"  # derived: the link blue
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#515151"
bg     = "#ffffff"
cursor = "#00b4ff"  # metro blue
ansi = [
	# white is #eeeeee, not the background itself, so white text and blocks stay visible
	"#515151", "#cf4343", "#2e8544", "#926f00", "#007eb2", "#9757cb", "#008282", "#bfbfbf",
	"#7c7c7c", "#e04848", "#3aa655", "#b88b00", "#009edf", "#9b59d0", "#00a4a4", "#eeeeee",
]
