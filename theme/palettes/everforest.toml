# Everforest: sainnhe/everforest (autoload/everforest.vim, dark hard), MIT license. Deep pine-slate
# ground (#1e2326 / #272e33) with muted aqua, sage green, warm sand and rose — built for long
# sessions with minimal glare.

[meta]
name = "Everforest"
variant = "dark"
source = "https://github.com/sainnhe/everforest"

[colors]
bg_desktop      = "#1e2326"  # bg_dim (hard: chrome a step below editor)
bg_surface      = "#272e33"  # bg0 (Normal)
bg_widget       = "#2e383c"  # bg1 (Pmenu, CursorLine)
bg_hover        = "#374145"  # bg2 (Hover)
border_hairline = "#374145"  # bg2
border_inactive = "#4f5b58"  # bg5 (FloatBorder)
fg_text         = "#d3c6aa"  # fg (Normal)
fg_editor       = "#d3c6aa"  # fg (Normal)
fg_secondary    = "#9da9a0"  # grey2 (StatusLine)
fg_muted        = "#859289"  # grey1 (Comment)
fg_bright       = "#e6dfc8"  # derived: fg lifted toward white
fg_disabled     = "#7a8478"  # grey0 (LineNr)
accent          = "#a7c080"  # green / statusline1
badge           = "#d699b6"  # purple
selection_bg    = "#414b50"  # bg3 (Visual)
selection_fg    = "#d3c6aa"  # fg
link            = "#7fbbb3"  # blue
error           = "#e67e80"  # red
warning         = "#dbbc7f"  # yellow
success         = "#a7c080"  # green
info            = "#7fbbb3"  # blue
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#d3c6aa"  # fg
bg     = "#272e33"  # bg0
cursor = "#d3c6aa"  # fg
ansi = [
	# bg3, red, green, yellow, blue, purple, aqua, fg
	"#414b50", "#e67e80", "#a7c080", "#dbbc7f", "#7fbbb3", "#d699b6", "#83c092", "#d3c6aa",
	# grey1, red, green, orange, blue, purple, aqua, fg_bright
	"#859289", "#e67e80", "#a7c080", "#e69875", "#7fbbb3", "#d699b6", "#83c092", "#e6dfc8",
]

[diff]
add    = "#a7c080"  # green
remove = "#e67e80"  # red
change = "#7fbbb3"  # blue

[syntax]
keyword    = "#e67e80"  # red: Keyword, Statement
preproc    = "#d699b6"  # purple: PreProc
type       = "#dbbc7f"  # yellow: Type
function   = "#a7c080"  # green: Function
identifier = "#d3c6aa"  # fg: Identifier
string     = "#83c092"  # aqua: String
constant   = "#d699b6"  # purple: Constant
number     = "#d699b6"  # purple: Number
boolean    = "#d699b6"  # purple: Boolean
special    = "#7fbbb3"  # blue: Special
operator   = "#e69875"  # orange: Operator
comment    = "#859289"  # grey1: Comment
