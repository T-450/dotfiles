# Flexoki Light: kepano/flexoki (and nuvic/flexoki-nvim dawn variant), MIT license. Warm paper
# (#fffcf0 / #f2f0e5) with calibrated 600-series analog ink hues — complements Alabaster's cool
# neutral light with an archival print warmth.

[meta]
name = "Flexoki Light"
variant = "light"
source = "https://github.com/kepano/flexoki"

[colors]
bg_desktop      = "#f2f0e5"  # base-50 (chrome a step below paper)
bg_surface      = "#fffcf0"  # paper (Normal)
bg_widget       = "#fffdf5"  # surface (Pmenu, Float)
bg_hover        = "#e6e4d9"  # base-100 (highlight_low)
border_hairline = "#dad8ce"  # base-150 (highlight_med)
border_inactive = "#cecdc3"  # base-200 (highlight_high)
fg_text         = "#100f0f"  # black (text)
fg_editor       = "#100f0f"  # black (text)
fg_secondary    = "#575653"  # base-700
fg_muted        = "#6f6e69"  # base-600 (subtle / comment)
fg_bright       = "#100f0f"  # black
fg_disabled     = "#b7b5ac"  # base-300 (muted)
accent          = "#24837b"  # cyan-600
badge           = "#5e409d"  # purple-600
selection_bg    = "#dad8ce"  # base-150
selection_fg    = "#100f0f"  # black
link            = "#205ea6"  # blue-600
error           = "#af3029"  # red-600
warning         = "#ad8301"  # yellow-600 (warning)
success         = "#66800b"  # green-600
info            = "#205ea6"  # blue-600
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#100f0f"
bg     = "#fffcf0"
cursor = "#100f0f"
ansi = [
	# black, red-600, green-600, yellow-600, blue-600, purple-600, cyan-600, base-300
	"#100f0f", "#af3029", "#66800b", "#ad8301", "#205ea6", "#5e409d", "#24837b", "#b7b5ac",
	# base-600, orange-600, green-400, yellow-400, blue-400, magenta-600, cyan-400, paper
	"#6f6e69", "#bc5215", "#879a39", "#d0a215", "#4385be", "#a02f6f", "#3aa99f", "#fffcf0",
]

[diff]
add    = "#66800b"  # green-600
remove = "#af3029"  # red-600
change = "#ad8301"  # yellow-600

[syntax]
keyword    = "#66800b"  # green-600: Keyword
preproc    = "#a02f6f"  # magenta-600: PreProc
type       = "#ad8301"  # yellow-600: Type
function   = "#bc5215"  # orange-600: Function
identifier = "#100f0f"  # black: Identifier
string     = "#24837b"  # cyan-600: String
constant   = "#5e409d"  # purple-600: Constant
number     = "#5e409d"  # purple-600: Number
boolean    = "#5e409d"  # purple-600: Boolean
special    = "#205ea6"  # blue-600: Special
operator   = "#6f6e69"  # base-600: Operator
comment    = "#6f6e69"  # base-600: Comment
