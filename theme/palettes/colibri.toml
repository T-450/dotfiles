# Colibri: archseer/colibri.vim (colors/colibri.vim, background=dark), by Blaž Hrastnik. Hues
# sampled from a hummingbird photo: deep purples, lavender text, few accents. The comment on each
# role is the colibri.vim color and the highlight group it comes from; "derived" marks a tier the
# scheme doesn't have. [terminal] uses only colibri.vim's colors (and swatch.html's #81CECF);
# [syntax] is its syntax mapping, so vim and helix read like colibri.vim.

[meta]
name = "Colibri"
variant = "dark"
source = "https://github.com/archseer/colibri.vim"

[colors]
bg_desktop      = "#281733"  # revolver: background_dark (the bar and desktop chrome, a step below the terminal)
bg_surface      = "#452859"  # bossanova: background_light (CursorLine, TabLine, window)
bg_widget       = "#452859"  # bossanova: window (Pmenu)
bg_hover        = "#533a6e"  # derived: bossanova 15% toward lavender
border_hairline = "#3b224c"  # midnight: background (Normal)
border_inactive = "#5a5977"  # comet: linenr
fg_text         = "#a4a0e8"  # lavender: foreground (Normal)
fg_editor       = "#a4a0e8"  # lavender: foreground (Normal)
fg_secondary    = "#8a80c1"  # derived: lavender 25% toward midnight
fg_muted        = "#697c81"  # sirocco: comment
fg_bright       = "#ffffff"  # white: fg2 (TabLineSel, MatchParen)
fg_disabled     = "#5a5977"  # comet: linenr (LineNr)
accent          = "#dbbfef"  # lilac: active (StatusLine, WildMenu)
badge           = "#dbbfef"  # lilac: active
selection_bg    = "#802f00"  # cedar: highlight (Visual)
selection_fg    = "#ffffff"  # white
link            = "#efba5d"  # honey: special
error           = "#f47868"  # error (ErrorMsg)
warning         = "#ffcd1c"  # warning (WarningMsg, Search)
success         = "#35bf86"  # diff_green (MoreMsg, DiffAdded)
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#a4a0e8"  # lavender
bg     = "#3b224c"  # midnight
cursor = "#dbbfef"  # lilac
ansi = [
	# revolver, error, diff_green, honey, diff_change (#69A0F3), light-mode lilac, swatch #81CECF, silver
	"#281733", "#f47868", "#35bf86", "#efba5d", "#69a0f3", "#c590eb", "#81cecf", "#cccccc",
	# sirocco, diff_red, mint, chamois, lavender, lilac, neon (SpecialKey), white
	"#697c81", "#f22c86", "#9ff28f", "#e8dca0", "#a4a0e8", "#dbbfef", "#2cf2f1", "#ffffff",
]

[syntax]
keyword    = "#eccdba"  # almond: Statement, Define
preproc    = "#dbbfef"  # lilac: PreProc (punct)
type       = "#ffffff"  # white: Type (proper)
function   = "#ffffff"  # white: Function (func)
identifier = "#ffffff"  # white: Identifier (builtin)
string     = "#cccccc"  # silver: String
constant   = "#9ff28f"  # mint: Constant
number     = "#e8dca0"  # chamois: Number, Float
boolean    = "#ffffff"  # white: Boolean (bool)
special    = "#efba5d"  # honey: Special
operator   = "#dbbfef"  # lilac: Operator, Delimiter (punct)
comment    = "#697c81"  # sirocco: Comment
