# Steel Nebula: the NuPhy Air60 HE's charcoal, steel and violet, following a community scheme as
# closely as possible: Precious Dark Eleven (4lex4, github.com/precious-themes/base16-precious-schemes,
# via tinted-theming), the nearest of 624 tinted-theming schemes to the keyboard's colors (CIELAB
# distance over background, text, violet, amber, red, green and surface). Every neutral, text and
# status color it defines is used as is (baseNN in the comments). The purples come from Colibri
# (archseer, github.com/archseer/colibri.vim, the palette of Helix's default theme): lavender is the
# accent and cursor, lilac the links and brightest highlights, bossanova the selection, comet the
# badges. Derived, since the scheme has no brighter text tier: fg_bright. Restrained on purpose:
# purple, blacks, greys and whites, plus three status colors (error red, warning amber, success
# green); the scheme's blue, cyan, orange and pink are left out. Every text role reads at WCAG AA (4.5:1)
# on bg_desktop, bg_surface and bg_widget; fg_muted and fg_disabled are for non-essential text.

[meta]
name = "Steel Nebula"
variant = "dark"
source = "base16:precious-dark-eleven (tinted-theming); purples: colibri.vim; keycaps: NuPhy Air60 HE"
# its own wallpaper: a nebula in its purples (swaybg/render.sh)
wallpaper = "nebula"

[colors]
bg_desktop      = "#1c1e20"  # base00
bg_surface      = "#232527"  # between base00 and base01
bg_widget       = "#292b2d"  # base01
bg_hover        = "#37393a"  # base02
border_hairline = "#2e3032"  # between base01 and base02
border_inactive = "#3f4143"  # base02, a step lighter
fg_text         = "#b8b7b6"  # base05
fg_editor       = "#b8b7b6"  # base05
fg_secondary    = "#a8a8a7"  # base04
fg_muted        = "#858585"  # base03
fg_bright       = "#e4e3e2"  # base05 lifted toward the keyboard's white legends
fg_disabled     = "#5b5c5d"  # base02 toward base03
accent          = "#a4a0e8"  # colibri lavender
badge           = "#5a5977"  # colibri comet
selection_bg    = "#452859"  # colibri bossanova
selection_fg    = "#e4e3e2"
link            = "#dbbfef"  # colibri lilac
error           = "#ff8782"  # base08
warning         = "#d0a543"  # base0A, the amber
success         = "#95b658"  # base0B
shadow          = "#000000"

[terminal]
fg     = "#b8b7b6"  # base05
bg     = "#1c1e20"  # base00
cursor = "#a4a0e8"  # colibri lavender
# restrained: purple, greys and whites, and three status colors (red, amber, green); the blue and
# cyan slots hold purples and greys, the orange slot the amber
ansi = [
	"#292b2d", "#ff8782", "#95b658", "#d0a543", "#a4a0e8", "#dbbfef", "#a8a8a7", "#b8b7b6",
	"#6b6b6c", "#ff8782", "#95b658", "#d0a543", "#dbbfef", "#a4a0e8", "#cfcecd", "#e4e3e2",
]

[keycaps]
# NuPhy Air60 HE (nuphy.com product photos): black modifier caps, grey letter caps, the violet
# accent caps, white legends, the aluminium frame, the amber sub-legends. Same on every palette:
# the cheatsheet looks like the keyboard. The violet caps are translucent on dark palettes (theme
# composites #rrggbbaa over bg_desktop); every legend must read at AA on its cap, or theme fails.
mod    = "#2e2e30"
cap    = "#626165"
accent = "#6a5bc7d9"  # translucent, like the board: 85% over the panel
legend = "#f2f2f2"
frame  = "#9d9d9d"
amber  = "#dcb04a"
