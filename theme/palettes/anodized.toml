# Anodized: aluminium given its color by a thin clear layer, as on the NuPhy Air60 HE: charcoal and
# steel, with one run of color, cyan -> blue -> violet. The neutrals follow a community scheme:
# Precious Dark Eleven (4lex4, github.com/precious-themes/base16-precious-schemes, via
# tinted-theming), the nearest of 624 tinted-theming schemes to the keyboard's colors (CIELAB
# distance over background, text, violet, amber, red, green and surface). Its backgrounds and
# status colors are used as is (baseNN in the comments). The purples come from Colibri (archseer,
# github.com/archseer/colibri.vim, the palette of Helix's default theme) and lead: lavender is
# the accent and cursor, lilac its pale tint, comet the badges. The accent is one
# family, a cyan -> blue -> purple run, as on a navy board with cyan Esc and Enter caps: the blue and
# the cyan are drawn at the lavender's and lilac's own lightness and chroma (OKLCH 0.74/0.10 and
# 0.84/0.07) at hues 258 and 210, so the three read as one color turning, 286 -> 258 -> 210. Each has
# one job: lavender is the line (focus, cursor), blue the mass (the indigo selection, the terminal's
# blue), cyan the spark (links and matches, the terminal's cyan). Restrained on purpose: that run,
# blacks, greys and whites, plus three status colors (error red, warning amber, success green); the
# scheme's teal, orange and pink are left out, and the background stays black, not navy. Lifted from
# the scheme, for an even text ladder that stays legible (OKLCH L 0.57, 0.66, 0.73, 0.83, 0.92):
# fg_bright, fg_text, fg_muted, fg_disabled. Every text role reads at WCAG AA (4.5:1) on bg_desktop,
# bg_surface and bg_widget; fg_disabled, the one exception, reads at 3:1 or better on all three.
# Borders stay quiet (focus is the accent, 7:1) but visible on every surface they are drawn on,
# thin metal edges. The greys are aluminium and charcoal: one cool-neutral ladder (hue 248, chroma
# under 0.006), with the scheme's faint warm cast in the text tiers taken out. Color is scarce and
# means action, as the violet caps do on the board.

[meta]
name = "Anodized"
variant = "dark"
source = "base16:precious-dark-eleven (tinted-theming); purples: colibri.vim; blue and cyan: derived at their lightness; keycaps: NuPhy Air60 HE"

[colors]
bg_desktop      = "#1c1e20"  # base00
bg_surface      = "#232527"  # between base00 and base01
bg_widget       = "#292b2d"  # base01
bg_hover        = "#37393a"  # base02
border_hairline = "#3d3f41"  # a step above base02: 1.3:1 or better on every surface it outlines
border_inactive = "#525456"  # two steps above base02: 2.2:1 on the desktop
fg_text         = "#c6c7c8"  # base05, lifted a step and cooled: 9.9:1
fg_editor       = "#c6c7c8"
fg_secondary    = "#a7a8a9"  # base04, cooled
fg_muted        = "#919293"  # base03, cooled, lifted to AA on bg_widget (4.6:1)
fg_bright       = "#e2e3e4"  # the aluminium white: base05 lifted toward the keyboard's legends
fg_disabled     = "#757677"  # between base02 and base03: 3.1:1 on bg_widget
accent          = "#a4a0e8"  # colibri lavender
badge           = "#5a5977"  # colibri comet
selection_bg    = "#273776"  # the blue, deep: indigo (OKLCH 0.36/0.11, hue 270)
selection_fg    = "#e2e3e4"
link            = "#94d8e4"  # the cyan, at lilac's lightness and chroma
error           = "#ff8782"  # base08
warning         = "#d0a543"  # base0A, the amber
success         = "#95b658"  # base0B
shadow          = "#000000"

[terminal]
fg     = "#c6c7c8"  # fg_text
bg     = "#1c1e20"  # base00
cursor = "#a4a0e8"  # colibri lavender
# restrained: the cyan -> blue -> purple run at two lightnesses, greys and whites, and three status
# colors (red, amber, green). Blue slots: the blue; magenta slots: lavender and lilac; cyan slots:
# the cyan; the orange slot holds the amber; bright black is base03 (comments), cooled, AA on the background
ansi = [
	"#292b2d", "#ff8782", "#95b658", "#d0a543", "#83adea", "#a4a0e8", "#51bcce", "#c6c7c8",
	"#858687", "#ff8782", "#95b658", "#d0a543", "#afcdf9", "#dbbfef", "#94d8e4", "#e2e3e4",
]

[keycaps]
# NuPhy Air60 HE (nuphy.com product photos): black modifier caps, grey letter caps, the violet
# accent caps, white legends, the aluminium frame, the amber sub-legends. Same on every palette:
# the cheatsheet looks like the keyboard. The violet caps are translucent on dark palettes (theme
# composites #rrggbbaa over bg_desktop); every legend must read at AA on its cap, or theme fails.
mod    = "#2e2e30"
cap    = "#626165"
accent = "#6a5bc7d9"  # translucent, like the board: 85% over the panel
legend = "#f2f2f2"
frame  = "#9d9d9d"
amber  = "#dcb04a"
