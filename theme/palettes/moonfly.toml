# Moonfly: https://terminalcolors.com/themes/moonfly/default/ and bluz71/vim-moonfly-colors
# (lua/moonfly/init.lua, lua/lualine/themes/moonfly.lua), MIT license. Midnight obsidian (#080808)
# canvas with charcoal UI steps (grey7..grey27) and high-contrast syntax/UI accents applied the
# same way Moonfly styles Neovim: Normal on black, StatusLine/TabLine on grey7/grey11, Pmenu and
# NormalFloat on grey13, CursorLine on grey11, FloatBorder on grey27, accent blue (#80a0ff),
# turquoise identifiers, sky functions, emerald types, violet keywords, khaki strings, cranberry
# operators/booleans/preproc, orange constants, grey58 comments. [terminal] matches
# terminalcolors.com/themes/moonfly/default/ verbatim.

[meta]
name = "Moonfly"
variant = "dark"
source = "https://terminalcolors.com/themes/moonfly/default/"

[colors]
bg_desktop      = "#121212"  # grey7: ColorColumn / TablineSel (~lualine color_bg2 #131313; vp_bar -> #070707)
bg_surface      = "#1c1c1c"  # grey11: StatusLine (transparent) / TablineFill / CursorLine
bg_widget       = "#212121"  # grey13: Pmenu / NormalFloat
bg_hover        = "#2e2e2e"  # grey18: lualine color_bg1 / DiffChange (CursorLine mix -> #1b1b1b)
border_hairline = "#292929"  # grey16: VertSplit / WinSeparator
border_inactive = "#444444"  # grey27: FloatBorder / PmenuBorder
fg_text         = "#bdbdbd"  # terminalcolors.com foreground (UI body text)
fg_editor       = "#c6c6c6"  # white: Normal fg
fg_secondary    = "#b2b2b2"  # grey70: NormalFloat / lualine color9
fg_muted        = "#949494"  # grey58: Comment / ansi[8]
fg_bright       = "#e4e4e4"  # grey89: PmenuSel / Search fg / ansi[15]
fg_disabled     = "#626262"  # grey39: LineNr / NonText / Dimmed
accent          = "#80a0ff"  # blue: CursorLineNr / TablineSel / lualine normal / terminalcolors accent
badge           = "#74b2ff"  # sky: Title / Function / PmenuKind
selection_bg    = "#b2ceee"  # terminalcolors.com selection-background
selection_fg    = "#080808"  # black: terminalcolors.com selection-foreground
link            = "#74b2ff"  # sky: DiagnosticInfo / links
error           = "#ff5454"  # red: terminalcolors.com ansi[1] / Error / DiagnosticError
warning         = "#e3c78a"  # yellow: DiagnosticWarn / Todo / IncSearch
success         = "#36c692"  # emerald: DiagnosticOk / lualine insert / Underlined
info            = "#74b2ff"  # sky: DiagnosticInfo
shadow          = "#000000"  # constant

[terminal]
fg     = "#bdbdbd"  # terminalcolors.com foreground
bg     = "#080808"  # black: Normal bg
cursor = "#9e9e9e"  # grey62: terminalcolors.com cursor-color / Cursor bg
ansi = [
	# grey0, red, green, yellow, blue, violet, turquoise, white
	"#323437", "#ff5454", "#8cc85f", "#e3c78a", "#80a0ff", "#cf87e8", "#79dac8", "#c6c6c6",
	# grey58, crimson, emerald, khaki, sky, purple, lime, grey89
	"#949494", "#ff5189", "#36c692", "#c6c684", "#74b2ff", "#ae81ff", "#85dc85", "#e4e4e4",
]

[diff]
add    = "#36c692"  # emerald: GitSignsAdd / DiagnosticOk
remove = "#ff5189"  # crimson: GitSignsDelete / MoonflyCrimson
change = "#80a0ff"  # blue: GitSignsChange

[syntax]
keyword    = "#cf87e8"  # violet: Statement, Repeat, StorageClass
preproc    = "#e65e72"  # cranberry: PreProc
type       = "#36c692"  # emerald: Type
function   = "#74b2ff"  # sky: Function
identifier = "#79dac8"  # turquoise: Identifier
string     = "#c6c684"  # khaki: String
constant   = "#de935f"  # orange: Constant
number     = "#de935f"  # orange: Number, Float
boolean    = "#e65e72"  # cranberry: Boolean
special    = "#e65e72"  # cranberry: Special
operator   = "#e65e72"  # cranberry: Operator
comment    = "#949494"  # grey58: Comment
