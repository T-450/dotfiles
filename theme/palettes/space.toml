# Space: Material 3 palette for the shapeshifter shell
# (docs/designs/material-shapeshifter/SPEC-theme.md).
# Key colors: Space blue #3ea7ce (primary) from COLOURlovers 787684 Space by erinneryan,
# CC BY-NC-SA 3.0; Alchemist yellow #fcef77 (secondary; habamax/vim-alchemist: the yellow is
# the cursor and the keyword); Gruber Darker (blazkowolf/gruber-darker.nvim, MIT): niagara
# #96a6c8 (tertiary), red #f43841 (error), green #73d936 (success, a custom color).
# Neutral: the Space navy, HCT hue 283, chroma 6; neutral variant chroma 8. The key colors are
# recovered from the uploaded inputs (their tonal palettes reproduce the inputs' 12 fixed roles
# exactly); which 787684 swatch each one is was not checked.
# Computed once with materialyoucolor 3.0.4, colour spec 2021, Variant.FIDELITY, contrast 0.
# Dark keeps the red and green sources (they read 4.5:1 on surface); light uses their tone 40.
# [colors], [terminal] and [syntax] map M3 roles by the spec's tables. Magenta and cyan are
# custom colors at the sRGB primaries' HCT hues and primary's chroma; the bright row is
# 10 tones toward the text.
# Floors, measured by theme's contrast() (needs 4.5, outline 3):
# on_primary/primary 7.70, on_secondary/secondary 7.72
# on_tertiary/tertiary 7.77, on_error/error 5.49
# on_primary_container/primary_container 4.58, on_secondary_container/secondary_container 6.44
# on_tertiary_container/tertiary_container 4.57, on_error_container/error_container 7.22
# on_surface/surface 14.33, on_surface_variant/surface 10.87
# inverse_on_surface/inverse_surface 10.14, outline/surface 5.82

[meta]
name = "Space"
variant = "dark"
source = "COLOURlovers 787684 Space by erinneryan, CC BY-NC-SA 3.0; Alchemist; Gruber Darker MIT"

[material]
primary                    = "#70d2fb"
on_primary                 = "#003546"
primary_container          = "#3ea7ce"
on_primary_container       = "#00384a"
secondary                  = "#d5c956"
on_secondary               = "#363100"
secondary_container        = "#9d9324"
on_secondary_container     = "#060500"
tertiary                   = "#b7c7ea"
on_tertiary                = "#20304d"
tertiary_container         = "#8c9cbe"
on_tertiary_container      = "#243350"
error                      = "#f43841"
on_error                   = "#000000"
error_container            = "#930017"
on_error_container         = "#ffdad7"
surface                    = "#131318"
on_surface                 = "#e4e1e9"
on_surface_variant         = "#c7c5d0"
surface_dim                = "#131318"
surface_bright             = "#39393f"
surface_container_lowest   = "#0e0e13"
surface_container_low      = "#1b1b21"
surface_container          = "#1f1f25"
surface_container_high     = "#2a292f"
surface_container_highest  = "#35343a"
inverse_surface            = "#e4e1e9"
inverse_on_surface         = "#303036"
inverse_primary            = "#006684"
outline                    = "#918f9a"
outline_variant            = "#46464f"
primary_fixed              = "#bde9ff"
primary_fixed_dim          = "#70d2fb"
on_primary_fixed           = "#001f2a"
on_primary_fixed_variant   = "#004d64"
secondary_fixed            = "#f2e56f"
secondary_fixed_dim        = "#d5c956"
on_secondary_fixed         = "#1f1c00"
on_secondary_fixed_variant = "#4e4800"
tertiary_fixed             = "#d7e3ff"
tertiary_fixed_dim         = "#b7c7ea"
on_tertiary_fixed          = "#091b36"
on_tertiary_fixed_variant  = "#374764"
shadow                     = "#000000"
scrim                      = "#000000"

[colors]
bg_desktop      = "#131318"
bg_surface      = "#1f1f25"
bg_widget       = "#2a292f"
bg_hover        = "#35343a"
border_hairline = "#46464f"
border_inactive = "#918f9a"
fg_text         = "#e4e1e9"
fg_editor       = "#e4e1e9"
fg_secondary    = "#c7c5d0"
fg_muted        = "#918f9a"
fg_bright       = "#fbf8ff"
fg_disabled     = "#46464f"
accent          = "#70d2fb"
badge           = "#b7c7ea"
selection_bg    = "#9d9324"
selection_fg    = "#060500"
link            = "#70d2fb"
error           = "#f43841"
warning         = "#d5c956"
success         = "#73d936"
shadow          = "#000000"

[terminal]
fg     = "#e4e1e9"
bg     = "#131318"
cursor = "#d5c956"
ansi = [
	"#0e0e13", "#f43841", "#73d936", "#d5c956", "#70d2fb", "#fbadef", "#5fd8d8", "#c7c5d0",
	"#918f9a", "#ff6e6b", "#8ef651", "#f2e56e", "#bce9ff", "#ffd7f5", "#7ef5f4", "#fbf8ff",
]

[syntax]
keyword  = "#d5c956"  # secondary (Alchemist yellow)
constant = "#b7c7ea"  # tertiary (niagara)
number   = "#fbadef"  # custom magenta
