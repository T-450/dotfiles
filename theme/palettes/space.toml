# Space: COLOURlovers palette 787684 by erinneryan, CC BY-NC-SA 3.0 (credit erinneryan; no
# commercial use; derivatives under the same license). Four colors: Dena is Navy (#16184d),
# Vsionary (#3ea7ce), Cotton Cloud (#cce2eb), Kiss Me I You Dare (#fcef77). Every other tier is
# derived from them and marked so; the palette has no red, green, blue or violet, so those terminal
# hues are picked to sit on the navy at 6:1 or more.

[meta]
name = "Space"
variant = "dark"
source = "https://www.colourlovers.com/palette/787684/Space"

[colors]
bg_desktop      = "#0f1136"  # derived: Dena is Navy, 30% toward black
bg_surface      = "#16184d"  # Dena is Navy
bg_widget       = "#232658"  # derived: navy, 7% toward Cotton Cloud
bg_hover        = "#2f3463"  # derived: navy, 14% toward Cotton Cloud
border_hairline = "#282c5d"  # derived: navy, 10% toward Cotton Cloud
border_inactive = "#495179"  # derived: navy, 28% toward Cotton Cloud
fg_text         = "#cce2eb"  # Cotton Cloud
fg_editor       = "#cce2eb"  # Cotton Cloud
fg_secondary    = "#95a5bc"  # derived: Cotton Cloud, 30% toward navy
fg_muted        = "#717d9c"  # derived: Cotton Cloud, 50% toward navy
fg_bright       = "#e6f0f5"  # derived: Cotton Cloud, 50% toward white
fg_disabled     = "#4d557c"  # derived: Cotton Cloud, 70% toward navy
accent          = "#3ea7ce"  # Vsionary
badge           = "#fcef77"  # Kiss Me I You Dare
selection_bg    = "#3ea7ce"  # Vsionary
selection_fg    = "#16184d"  # Dena is Navy
link            = "#3ea7ce"  # Vsionary
error           = "#ff7a8a"  # picked: coral
warning         = "#fcef77"  # Kiss Me I You Dare
success         = "#7fd4a0"  # picked: mint
info            = "#8fa8ff"  # picked: periwinkle
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#cce2eb"  # Cotton Cloud
bg     = "#16184d"  # Dena is Navy
cursor = "#fcef77"  # Kiss Me I You Dare
ansi = [
	# navy lifted, coral, mint, Kiss Me I You Dare, periwinkle, lilac, Vsionary, Cotton Cloud
	"#282c5d", "#ff7a8a", "#7fd4a0", "#fcef77", "#8fa8ff", "#c9a0ff", "#3ea7ce", "#cce2eb",
	# fg_muted, then each hue 35% toward white, Cotton Cloud lit
	"#717d9c", "#ffa9b3", "#ace3c1", "#fdf5a7", "#b6c6ff", "#dcc1ff", "#82c6df", "#e6f0f5",
]
