# Imported with `theme import-*` from vscode:https://raw.githubusercontent.com/microsoft/vscode/main/extensions/theme-defaults/themes/2026-light.json
# Except: selection_bg, selection_fg and the whole [terminal] section come from the light-2026
# Ghostty theme (github.com/dark-2026-theme/nvim, themes/light-2026.conf); re-importing loses them.

[meta]
name = "2026 Light"
variant = "light"
source = "vscode:https://raw.githubusercontent.com/microsoft/vscode/main/extensions/theme-defaults/themes/2026-light.json"

[colors]
bg_desktop      = "#ffffff"  # editor.background
bg_surface      = "#fafafd"  # statusBar.background
bg_widget       = "#fafafd"  # quickInput.background
bg_hover        = "#e3e3e5"  # statusBarItem.hoverBackground
border_hairline = "#e2e2e5"  # widget.border
border_inactive = "#ececee"  # input.border
fg_text         = "#202020"  # foreground
fg_editor       = "#202020"  # editor.foreground
fg_secondary    = "#606060"  # descriptionForeground
fg_muted        = "#606060"  # editorLineNumber.foreground
fg_bright       = "#202020"  # list.activeSelectionForeground
fg_disabled     = "#bbbbbb"  # disabledForeground
accent          = "#0069cc"  # focusBorder (alpha dropped)
badge           = "#0069cc"  # badge.background
selection_bg    = "#c2daf5"  # light-2026 Ghostty selection-background
selection_fg    = "#202020"  # light-2026 Ghostty selection-foreground
link            = "#0069cc"  # textLink.foreground
error           = "#ad0707"  # errorForeground
warning         = "#667309"  # list.warningForeground
success         = "#587c0c"  # gitDecoration.addedResourceForeground
shadow          = "#000000"  # constant

[terminal]
# light-2026 Ghostty theme: foreground, background, cursor-color, palette 0-15
fg     = "#202020"
bg     = "#ffffff"
cursor = "#0069cc"
ansi = [
	"#f0f1f2", "#cf222e", "#116329", "#953800", "#0550ae", "#8250df", "#116329", "#202020",
	"#999999", "#cf222e", "#116329", "#953800", "#0550ae", "#8250df", "#116329", "#ffffff",
]
