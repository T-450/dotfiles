# Elysian: Aszarsha/elysian.vim (colors/elysian.vim, xterm-256 indexes; elysian.itermcolors for
# the 16 terminal colors it also uses), by Anmol Sethi. MIT license. Near-black grounds, a cyan
# cursor line number, lilac functions. The comment on each role is the xterm index (or ANSI n,
# from the iTerm colors) and the highlight group it comes from; "derived" marks a tier the scheme
# doesn't have. [terminal] is elysian.itermcolors; [syntax] and [diff] are its highlight mapping,
# so every editor reads like it.

[meta]
name = "Elysian"
variant = "dark"
source = "https://github.com/Aszarsha/elysian.vim"

[colors]
bg_desktop      = "#080808"  # 232 (MatchParen)
bg_surface      = "#121311"  # ANSI 0 (Normal)
bg_widget       = "#1c1c1c"  # 234 (LineNr, CursorLine)
bg_hover        = "#2f3135"  # ANSI 11 (Pmenu)
border_hairline = "#262626"  # 235 (ColorColumn)
border_inactive = "#444444"  # 238 (VertSplit, TabLine)
fg_text         = "#bcbcbc"  # 250 (Normal)
fg_editor       = "#bcbcbc"  # 250 (Normal)
fg_secondary    = "#949494"  # derived: 242 halfway to 250
fg_muted        = "#6c6c6c"  # 242 (LineNr)
fg_bright       = "#ffffff"  # 231 (Title)
fg_disabled     = "#585858"  # 240 (NonText)
accent          = "#5fafaf"  # 73 (CursorLineNr, ModeMsg)
badge           = "#919dad"  # ANSI 5 (PmenuSel)
selection_bg    = "#87afd7"  # 110 (Visual)
selection_fg    = "#262626"  # 235 (Visual)
link            = "#b3c3d6"  # ANSI 12 (Directory)
error           = "#af5f5f"  # 131 (Error, WarningMsg)
warning         = "#ff8700"  # 208 (SpellRare)
success         = "#87af87"  # 108 (String, Question)
info            = "#93c2f6"  # ANSI 4 (Search)
shadow          = "#000000"  # black

[terminal]
fg     = "#b9baa2"
bg     = "#121311"
cursor = "#b9bba2"
ansi = [
	# bright black and bright yellow are greys upstream (#262626, the Pmenu #2f3135), unreadable as
	# text: bright black is 240 (Comment) and bright yellow is yellow (ANSI 3)
	"#121311", "#fa71b2", "#97d996", "#d1d895", "#93c2f6", "#919dad", "#9bbfb0", "#d3cfc5",
	"#585858", "#c9a1bd", "#bddead", "#d1d895", "#b3c3d6", "#b3a9d3", "#9fefcf", "#edebe6",
]

[diff]
# diffAdded -> String, diffRemoved -> WarningMsg, GitGutterChange
add    = "#87af87"  # 108
remove = "#af5f5f"  # 131
change = "#b3a9d3"  # ANSI 13

[syntax]
keyword    = "#87afd7"  # 110: Statement
preproc    = "#5f8787"  # 66: PreProc
type       = "#8787af"  # 103: Type
function   = "#d7afd7"  # 182: Function
identifier = "#5f87af"  # 67: Identifier
string     = "#87af87"  # 108: String
constant   = "#ff8787"  # 210: Constant
number     = "#ff8787"  # 210: Number -> Constant
boolean    = "#ff8787"  # 210: Boolean -> Constant
special    = "#5f875f"  # 65: Special
operator   = "#87afd7"  # 110: Operator -> Statement
comment    = "#585858"  # 240: Comment
