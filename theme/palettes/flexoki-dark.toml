# Flexoki Dark: kepano/flexoki (and nuvic/flexoki-nvim), MIT license. An inky, analog print
# palette on warm obsidian (#100f0f) with calibrated base-950..base-500 neutrals and saturated-yet-
# quiet ink accents — direct print-craft cousin of Cassette.

[meta]
name = "Flexoki Dark"
variant = "dark"
source = "https://github.com/kepano/flexoki"

[colors]
bg_desktop      = "#100f0f"  # black (deepest ink ground)
bg_surface      = "#1c1b1a"  # base-950 (Panel, StatusLine)
bg_widget       = "#282726"  # base-900 (highlight_low, Pmenu)
bg_hover        = "#343331"  # base-850 (highlight_med)
border_hairline = "#282726"  # base-900
border_inactive = "#403e3c"  # base-800 (highlight_high)
fg_text         = "#cecdc3"  # base-200 (text)
fg_editor       = "#cecdc3"  # base-200 (text)
fg_secondary    = "#878580"  # base-500 (subtle)
fg_muted        = "#6f6e69"  # base-600 (comment)
fg_bright       = "#f2f0e5"  # base-50 (bright ink)
fg_disabled     = "#575653"  # base-700 (muted)
accent          = "#3aa99f"  # cyan-400 (cyan_two)
badge           = "#8b7ec8"  # purple-400 (purple_two)
selection_bg    = "#343331"  # base-850
selection_fg    = "#f2f0e5"  # base-50
link            = "#4385be"  # blue-400 (blue_two)
error           = "#d14d41"  # red-400 (red_two)
warning         = "#d0a215"  # yellow-400 (yellow_two)
success         = "#879a39"  # green-400 (green_two)
info            = "#4385be"  # blue-400 (blue_two)
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#cecdc3"
bg     = "#100f0f"
cursor = "#cecdc3"
ansi = [
	# base-900, red-400, green-400, yellow-400, blue-400, purple-400, cyan-400, base-200
	"#282726", "#d14d41", "#879a39", "#d0a215", "#4385be", "#8b7ec8", "#3aa99f", "#cecdc3",
	# base-700, red-600->bright, green, orange-400, blue, magenta-400, cyan, base-50
	"#575653", "#da702c", "#879a39", "#d0a215", "#4385be", "#ce5d97", "#3aa99f", "#f2f0e5",
]

[diff]
add    = "#879a39"  # green-400
remove = "#d14d41"  # red-400
change = "#d0a215"  # yellow-400

[syntax]
keyword    = "#879a39"  # green-400: Keyword
preproc    = "#ce5d97"  # magenta-400: PreProc
type       = "#d0a215"  # yellow-400: Type
function   = "#da702c"  # orange-400: Function
identifier = "#cecdc3"  # base-200: Identifier
string     = "#3aa99f"  # cyan-400: String
constant   = "#8b7ec8"  # purple-400: Constant
number     = "#8b7ec8"  # purple-400: Number
boolean    = "#8b7ec8"  # purple-400: Boolean
special    = "#4385be"  # blue-400: Special
operator   = "#878580"  # base-500: Operator
comment    = "#6f6e69"  # base-600: Comment
