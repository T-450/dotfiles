# Alabaster: tonsky/sublime-scheme-alabaster (Alabaster.sublime-color-scheme), MIT license. A
# light scheme that colors only four things: strings green, constants magenta, definitions
# (entity.name) blue, comments red; keywords, types and calls stay black. The comment on each role
# is the scheme's variable or global and the scope it comes from; "derived" marks a tier the
# scheme doesn't have. The scheme has no terminal colors: [terminal] is ghostty's Alabaster
# (iTerm2-Color-Schemes, built from the same variables), except white (below). [diff] is the
# scheme's markup.inserted, markup.deleted and markup.changed.

[meta]
name = "Alabaster"
variant = "light"
source = "https://github.com/tonsky/sublime-scheme-alabaster"

[colors]
bg_desktop      = "#f0f0f0"  # line_highlight (the chrome a step off the editor)
bg_surface      = "#f7f7f7"  # background
bg_widget       = "#ffffff"  # derived: background toward white (popups above the page)
bg_hover        = "#e0e0e0"  # inactive_selection
border_hairline = "#e0e0e0"  # inactive_selection
border_inactive = "#b7b7b7"  # ghostty Alabaster white
fg_text         = "#000000"  # foreground
fg_editor       = "#000000"  # foreground
fg_secondary    = "#3c3c3c"  # derived: foreground halfway to grey
fg_muted        = "#777777"  # grey (punctuation, escapes)
fg_bright       = "#000000"  # foreground
fg_disabled     = "#aaaaaa"  # markup.ignored
accent          = "#007acc"  # active (caret, brackets, tags)
badge           = "#325cc0"  # blue (entity.name)
selection_bg    = "#bfdbfe"  # selection
selection_fg    = "#000000"  # foreground
link            = "#325cc0"  # blue
error           = "#aa3731"  # red (misspelling, invalid)
warning         = "#b58000"  # derived: ghostty yellow #cb9000 darkened to 3:1 on bg_desktop (the
                             # scheme's orange #ffbc5d is a highlight fill: 1.5:1 as text)
success         = "#448c27"  # green
info            = "#007acc"  # active
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#000000"
bg     = "#f7f7f7"
cursor = "#007acc"
ansi = [
	# white is #ffffff, not the background itself as upstream, so white text and blocks stay visible
	"#000000", "#aa3731", "#448c27", "#cb9000", "#325cc0", "#7a3e9d", "#0083b2", "#b7b7b7",
	"#777777", "#f05050", "#60cb00", "#f2af50", "#007acc", "#e64ce6", "#00aacb", "#ffffff",
]

[diff]
add    = "#6abf40"  # markup.inserted hsl(100, 50%, 50%)
remove = "#d2322d"  # markup.deleted hsl(2, 65%, 50%)
change = "#ec7f13"  # markup.changed hsl(30, 85%, 50%)

[syntax]
keyword    = "#000000"  # foreground: keywords are not colored
preproc    = "#000000"  # foreground
type       = "#000000"  # foreground
function   = "#325cc0"  # blue: entity.name (definitions)
identifier = "#000000"  # foreground
string     = "#448c27"  # green: string
constant   = "#7a3e9d"  # magenta: constant
number     = "#7a3e9d"  # magenta: constant.numeric
boolean    = "#7a3e9d"  # magenta: constant.language
special    = "#777777"  # grey: constant.character.escape
operator   = "#777777"  # grey: punctuation
comment    = "#aa3731"  # red: comment
