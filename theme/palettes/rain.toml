# Rain: COLOURlovers palette 3799726 "rain & a bit of sun" by macah, CC BY-NC-SA 3.0 (credit
# macah; no commercial use; derivatives under the same license). Five colors: smells like rain
# (#a6c4d0), ice and sky (#cbcfd1), Acqua (#d0eaf5), Touch (#ffe69c), warning light (#ffd557).
# All five are light, so the text is the rain blue darkened, the two yellows are fills (badge and
# selection), and every other tier is derived and marked so. It has no red, green or violet: the
# terminal hues are picked and darkened to 4.5:1 on the page (normal) and 3:1 (bright).

[meta]
name = "Rain"
variant = "light"
source = "https://www.colourlovers.com/palette/3799726/rain--a-bit-of-sun"

[colors]
bg_desktop      = "#d0eaf5"  # Acqua
bg_surface      = "#ecf7fb"  # derived: Acqua, 60% toward white
bg_widget       = "#ffffff"  # derived: white (popups above the page)
bg_hover        = "#cbcfd1"  # ice and sky
border_hairline = "#cbcfd1"  # ice and sky
border_inactive = "#a6c4d0"  # smells like rain
fg_text         = "#21272a"  # derived: smells like rain, 80% toward black
fg_editor       = "#21272a"  # derived: smells like rain, 80% toward black
fg_secondary    = "#57676d"  # derived: smells like rain darkened to 4.5:1 on Acqua
fg_muted        = "#70848c"  # derived: smells like rain darkened to 3:1 on Acqua
fg_bright       = "#141819"  # derived: smells like rain, 88% toward black
fg_disabled     = "#a6c4d0"  # smells like rain
accent          = "#416c80"  # derived: smells like rain deepened to 4.5:1 on Acqua
badge           = "#ffd557"  # warning light
selection_bg    = "#ffe69c"  # Touch
selection_fg    = "#21272a"  # fg_text
link            = "#416c80"  # derived: the accent
error           = "#b15252"  # picked: brick, 4.5:1
warning         = "#998034"  # derived: warning light darkened to 3:1 on Acqua (as text it reads
                             # 1.3:1: the yellows stay fills)
success         = "#467a56"  # picked: moss, 4.5:1
info            = "#416c80"  # derived: the accent
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#21272a"
bg     = "#ecf7fb"
cursor = "#416c80"
ansi = [
	"#21272a", "#b15252", "#467a56", "#886d1a", "#4372ad", "#7961a8", "#2d7788", "#a6c4d0",
	"#70848c", "#d06060", "#589a6c", "#ab8a21", "#4a7fc0", "#8a6fc0", "#3996ac", "#ffffff",
]
