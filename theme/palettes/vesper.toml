# Vesper: raunofreiberg/vesper & datsfilipe/vesper.nvim (lua/vesper/colors.lua), MIT license.
# True obsidian ground (#101010) with surgical warm sand (#ffc799) and mint (#99ffe4) accents —
# ultra-minimalist modern cousin of Gruber Darker and Oxide.

[meta]
name = "Vesper"
variant = "dark"
source = "https://github.com/datsfilipe/vesper.nvim"

[colors]
bg_desktop      = "#101010"  # bg (Normal: obsidian ground)
bg_surface      = "#161616"  # bgDark (StatusLine, Panel)
bg_widget       = "#232323"  # bgDarker (Pmenu, NormalFloat)
bg_hover        = "#282828"  # bgFloat (CursorLine, Hover)
border_hairline = "#282828"  # bgFloat
border_inactive = "#505050"  # border (FloatBorder)
fg_text         = "#d4d4d4"  # derived: fg (#cccccc) slightly lifted for UI legibility
fg_editor       = "#cccccc"  # fg: mix(#ffffff, #000000, 0.80)
fg_secondary    = "#a0a0a0"  # primary (StatusLine, Keywords)
fg_muted        = "#7e7e7e"  # comment: mix(#8b8b8b, #000000, 0.90)
fg_bright       = "#ffffff"  # white
fg_disabled     = "#505050"  # fgDisabled (LineNr)
accent          = "#ffc799"  # yellowDark (Vesper signature warm sand)
badge           = "#99ffe4"  # info / mint
selection_bg    = "#343434"  # fgSelection
selection_fg    = "#ffffff"  # white
link            = "#99ffe4"  # info (mint)
error           = "#ff8080"  # error / red
warning         = "#ffc799"  # warn / yellowDark
success         = "#82d9c2"  # green: mix(#99ffe4, #000000, 0.85)
info            = "#99ffe4"  # info
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#cccccc"
bg     = "#101010"
cursor = "#ffc799"
ansi = [
	# black, red, mint-green, sand-yellow, slate-blue, soft-lilac, mint-cyan, silver
	"#232323", "#ff8080", "#82d9c2", "#ffc799", "#8ba6c1", "#c5a3d6", "#99ffe4", "#cccccc",
	"#505050", "#ff9e9e", "#99ffe4", "#ffcfa8", "#a8c1db", "#d8beea", "#b8ffec", "#ffffff",
]

[diff]
add    = "#99ffe4"  # info / mint
remove = "#ff8080"  # red
change = "#ffc799"  # yellowDark

[syntax]
keyword    = "#a0a0a0"  # primary: keywords stay quiet grey
preproc    = "#a0a0a0"  # primary
type       = "#ffc799"  # yellowDark: Type
function   = "#ffc799"  # yellowDark: Function
identifier = "#ffffff"  # secondary: Identifier
string     = "#99ffe4"  # green/mint: String
constant   = "#ffc799"  # yellowDark: Constant
number     = "#ffc799"  # yellowDark: Number
boolean    = "#ffc799"  # yellowDark: Boolean
special    = "#ffcfa8"  # orange: Special
operator   = "#a0a0a0"  # primary: Operator
comment    = "#7e7e7e"  # comment: Comment
