# Tokyo Night: folke/tokyonight.nvim (night/storm palette, originally imported via omarchy).
# Upgraded with full [diff] and [syntax] from folke/tokyonight.nvim, while preserving its
# NuPhy Air60 HE [keycaps] table.

[meta]
name = "Tokyo Night"
variant = "dark"
source = "https://github.com/folke/tokyonight.nvim"

[colors]
bg_desktop      = "#13141c"  # bg_dark1 (chrome a step below the editor)
bg_surface      = "#1a1b26"  # bg (Normal)
bg_widget       = "#24283b"  # bg_popup (Pmenu, NormalFloat)
bg_hover        = "#2f3347"  # bg_highlight hover
border_hairline = "#252734"  # border
border_inactive = "#414868"  # terminal_black (FloatBorder)
fg_text         = "#a9b1d6"  # fg_dark (Normal)
fg_editor       = "#a9b1d6"  # fg_dark (Normal)
fg_secondary    = "#858caa"  # derived: fg_dark toward dark5
fg_muted        = "#565f89"  # comment
fg_bright       = "#c0caf5"  # fg (bright)
fg_disabled     = "#53576c"  # dark3
accent          = "#7aa2f7"  # blue (Focus, TabLineSel)
badge           = "#bb9af7"  # magenta
selection_bg    = "#292e42"  # bg_highlight (Visual)
selection_fg    = "#c0caf5"  # fg
link            = "#2ac3de"  # blue1
error           = "#f7768e"  # red
warning         = "#e0af68"  # yellow
success         = "#9ece6a"  # green
info            = "#0db9d7"  # blue2
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#a9b1d6"
bg     = "#1a1b26"
cursor = "#c0caf5"
ansi = [
	"#343646", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#449dab", "#a9b1d6",
	"#565f89", "#ff7a93", "#b9f27c", "#ff9e64", "#7da6ff", "#9d7cd8", "#0db9d7", "#c0caf5",
]

[diff]
add    = "#449dab"  # git.add
remove = "#f7768e"  # red (git.delete #914c54 is too dim on dark bars)
change = "#6183bb"  # git.change

[syntax]
keyword    = "#9d7cd8"  # purple: Keyword
preproc    = "#7dcfff"  # cyan: PreProc
type       = "#2ac3de"  # blue1: Type
function   = "#7aa2f7"  # blue: Function
identifier = "#c0caf5"  # fg: Identifier
string     = "#9ece6a"  # green: String
constant   = "#ff9e64"  # orange: Constant
number     = "#ff9e64"  # orange: Number
boolean    = "#ff9e64"  # orange: Boolean
special    = "#2ac3de"  # blue1: Special
operator   = "#89ddff"  # blue5: Operator
comment    = "#565f89"  # comment: Comment

[keycaps]
# NuPhy Air60 HE (nuphy.com product photos): black modifier caps, grey letter caps, the violet
# accent cap, white legends, the aluminium frame. The accent is the one lit key: mango-keys puts it
# under the selected row's action key only. It is translucent on dark palettes (theme composites
# #rrggbbaa over bg_desktop); every legend must read at AA on its cap, or theme fails.
mod    = "#2e2e30"
cap    = "#626165"
accent = "#6a5bc7d9"  # translucent, like the board: 85% over the panel
legend = "#f2f2f2"
frame  = "#9d9d9d"
