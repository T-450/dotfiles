# Kanso Zen: webhooked/kanso.nvim (lua/kanso/colors.lua & themes.lua, zen variant), MIT license.
# Deep abyssal ink (#090e13) with ultra-calm, low-chroma Kanagawa-descended syntax — an enhanced,
# quieter evolution of Deep Blue. ansi6 uses Kanso's aqua (#8ea4a2) rather than fg so cyan chrome
# stays distinct from text.

[meta]
name = "Kanso Zen"
variant = "dark"
source = "https://github.com/webhooked/kanso.nvim"

[colors]
bg_desktop      = "#090e13"  # zenBg0 (Normal: abyssal ink)
bg_surface      = "#14171d"  # inkBg0 (Panel)
bg_widget       = "#1c1e25"  # zenBg1 (Pmenu, Gutter)
bg_hover        = "#22262d"  # zenBg2 (CursorLine)
border_hairline = "#22262d"  # zenBg2 (FloatBorder)
border_inactive = "#393b44"  # zenBg3 (Indent, Border)
fg_text         = "#c5c9c7"  # fg (Normal)
fg_editor       = "#c5c9c7"  # fg (Normal)
fg_secondary    = "#a4a7a4"  # gray2 (fg_dim)
fg_muted        = "#75797f"  # gray4 (Comment)
fg_bright       = "#f2f1ef"  # fg2 (CursorLineNr active)
fg_disabled     = "#5c6066"  # gray5 (NonText, LineNr)
accent          = "#8ba4b0"  # blue3 (Function, Focus)
badge           = "#8992a7"  # violet2 (Keyword)
selection_bg    = "#223249"  # altBlue1 (Visual)
selection_fg    = "#f2f1ef"  # fg2
link            = "#7fb4ca"  # blue
error           = "#c4746e"  # red3 (Diag error, softer than #c34043)
warning         = "#dca561"  # yellow (Diag warning)
success         = "#8a9a7b"  # green3 (String, Git add)
info            = "#658594"  # blue2 (Diag info)
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#c5c9c7"  # fg
bg     = "#090e13"  # zenBg0
cursor = "#f2f1ef"  # fg2
ansi = [
	# zenBg0, red3, green3, yellow3, blue3, pink, aqua, gray2
	"#1c1e25", "#c4746e", "#8a9a7b", "#c4b28a", "#8ba4b0", "#a292a3", "#8ea4a2", "#c5c9c7",
	# gray3, red2, green2, yellow2, blue, violet, green5, fg2
	"#717c7c", "#e46876", "#87a987", "#e6c384", "#7fb4ca", "#938aa9", "#7aa89f", "#f2f1ef",
]

[diff]
add    = "#76946a"  # gitGreen
remove = "#c34043"  # gitRed
change = "#dca561"  # gitYellow

[syntax]
keyword    = "#8992a7"  # violet2: Keyword, Statement
preproc    = "#909398"  # gray3: PreProc
type       = "#8ea4a2"  # aqua: Type
function   = "#8ba4b0"  # blue3: Function
identifier = "#c5c9c7"  # fg: Variable
string     = "#8a9a7b"  # green3: String
constant   = "#b6927b"  # orange: Constant
number     = "#a292a3"  # pink: Number
boolean    = "#b6927b"  # orange: Boolean
special    = "#c4b28a"  # yellow3: Special
operator   = "#909398"  # gray3: Operator
comment    = "#75797f"  # gray4: Comment
