# Carbonfox: EdenEast/nightfox.nvim (lua/nightfox/palette/carbonfox.lua), MIT license. Built on
# IBM's Carbon Design System (Gray 100 #161616) — a direct sibling to IBM Plex and technical CAD
# instrumentation. Warning uses IBM Carbon Yellow 30 (#f1c21b) so warnings stay amber while
# Carbon's teal (#08bdba) keeps its cyan/type role.

[meta]
name = "Carbonfox"
variant = "dark"
source = "https://github.com/EdenEast/nightfox.nvim"

[colors]
bg_desktop      = "#0c0c0c"  # bg0: brighten(bg1, -4) (StatusLine, Float)
bg_surface      = "#161616"  # bg1: Carbon Gray 100 (Normal)
bg_widget       = "#252525"  # bg2: brighten(bg1, +6) (Pmenu, Fold)
bg_hover        = "#2a2a2a"  # sel0 (Visual, Popup)
border_hairline = "#282828"  # black.base
border_inactive = "#484848"  # bg4 (FloatBorder, WinSeparator)
fg_text         = "#f2f4f8"  # fg1 (Normal)
fg_editor       = "#f2f4f8"  # fg1 (Normal)
fg_secondary    = "#b6b8bb"  # fg2 (StatusLine, Operator)
fg_muted        = "#6e6f70"  # comment: blend(bg, fg, 0.4)
fg_bright       = "#ffffff"  # fg0 (bright)
fg_disabled     = "#525253"  # sel1 / fg3 (LineNr)
accent          = "#78a9ff"  # blue.base (IBM Carbon Blue 40)
badge           = "#be95ff"  # magenta.base (IBM Carbon Purple 40)
selection_bg    = "#2a2a2a"  # sel0
selection_fg    = "#f2f4f8"  # fg1
link            = "#33b1ff"  # cyan.base (IBM Carbon Cyan 40)
error           = "#ee5396"  # red.base (IBM Carbon Magenta 50)
warning         = "#f1c21b"  # IBM Carbon Yellow 30 (upstream diag.warn reuses magenta)
success         = "#25be6a"  # green.base (IBM Carbon Green 40)
info            = "#78a9ff"  # blue.base
shadow          = "#000000"  # (constant)

[terminal]
fg     = "#f2f4f8"  # fg1
bg     = "#161616"  # bg1
cursor = "#78a9ff"  # blue.base
ansi = [
	# black, red, green, carbon yellow-30, blue, magenta, teal/cyan, white
	"#282828", "#ee5396", "#25be6a", "#f1c21b", "#78a9ff", "#be95ff", "#3ddbd9", "#dfdfe0",
	# bright variants
	"#525253", "#ff7eb6", "#42be65", "#fddc69", "#a6c8ff", "#d4bbff", "#33b1ff", "#ffffff",
]

[diff]
add    = "#25be6a"  # git.add
remove = "#ee5396"  # git.removed
change = "#33b1ff"  # cyan.base

[syntax]
keyword    = "#be95ff"  # magenta.base: Keyword, Statement
preproc    = "#ff7eb6"  # pink.base: PreProc
type       = "#08bdba"  # yellow.base (Carbon Teal 40): Type
function   = "#78a9ff"  # blue.base: Function
identifier = "#f2f4f8"  # fg1: Variable
string     = "#25be6a"  # green.base: String
constant   = "#3ddbd9"  # orange.base (Carbon Teal 30): Constant
number     = "#3ddbd9"  # orange.base: Number
boolean    = "#3ddbd9"  # orange.base: Boolean
special    = "#33b1ff"  # cyan.base: Special
operator   = "#b6b8bb"  # fg2: Operator
comment    = "#6e6f70"  # comment: Comment
