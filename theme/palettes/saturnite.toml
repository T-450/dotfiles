# Saturnite: habamax/vim-saturnite (colortemplate/saturnite.colortemplate), "for the Saturday
# nights and other *day nights", by Maxim Kim. No license stated. Alchemist's colors on darker
# grounds, with blue keywords, golden functions and a navy selection. The comment on each role is
# the scheme's color name and the highlight group it comes from; "derived" marks a tier the scheme
# doesn't have. [terminal] is its own Term colors; [syntax] and [diff] are its highlight mapping,
# so every editor reads like it.

[meta]
name = "Saturnite"
variant = "dark"
source = "https://github.com/habamax/vim-saturnite"

[colors]
bg_desktop      = "#121212"  # color00 (Folded, ColorColumn)
bg_surface      = "#1c1c1c"  # background (Normal)
bg_widget       = "#3a3a3a"  # color16 (CursorLine)
bg_hover        = "#444444"  # color08 (Pmenu, TabLine)
border_hairline = "#2c2c2c"  # colorTitleNC (TitleBarNC)
border_inactive = "#444444"  # color08 (VertSplitNC)
fg_text         = "#bcbcbc"  # foreground (Normal)
fg_editor       = "#bcbcbc"  # foreground (Normal)
fg_secondary    = "#949494"  # derived: color07 halfway to foreground
fg_muted        = "#6c6c6c"  # color07 (LineNr)
fg_bright       = "#eeeeee"  # color15 (Title)
fg_disabled     = "#444444"  # color08 (NonText)
accent          = "#87afd7"  # color12 (Statement)
badge           = "#5f8787"  # color06 (Statusline, VertSplit, TabLineSel)
selection_bg    = "#1a3456"  # colorV (Visual)
selection_fg    = "#bcbcbc"  # foreground (Visual)
link            = "#d7af5f"  # color11 (Underlined)
error           = "#af5f5f"  # color01 (ErrorMsg)
warning         = "#af8700"  # color03 (WarningMsg)
success         = "#87af87"  # color10 (MoreMsg)
info            = "#5fafaf"  # color14 (Tag)
shadow          = "#000000"  # black

[terminal]
fg     = "#bcbcbc"
bg     = "#1c1c1c"
cursor = "#ffaf5f"  # colorC (Cursor)
ansi = [
	"#121212", "#af5f5f", "#5f875f", "#af8700", "#5f87af", "#5f5f87", "#5f8787", "#6c6c6c",
	"#444444", "#d7875f", "#87af87", "#d7af5f", "#87afd7", "#8787af", "#5fafaf", "#eeeeee",
]

[diff]
# Added, Removed, Changed (the sign-column colors; DiffAdd and friends are dark fills)
add    = "#5fd75f"  # Added
remove = "#d75f5f"  # Removed
change = "#ffaf5f"  # Changed

[syntax]
keyword    = "#87afd7"  # color12: Statement
preproc    = "#5f8787"  # color06: PreProc
type       = "#5f87af"  # color04: Type
function   = "#d7af5f"  # color11: Function
identifier = "#8787af"  # color13: Identifier
string     = "#87af87"  # color10: String
constant   = "#d7875f"  # color09: Constant
number     = "#d7875f"  # color09: Number -> Constant
boolean    = "#d7875f"  # color09: Boolean -> Constant
special    = "#5f875f"  # color02: Special
operator   = "#87afd7"  # color12: Operator -> Statement
comment    = "#87875f"  # colorCom: Comment
