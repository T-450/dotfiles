# Material 3 system tokens for the shell (docs/designs/material-shapeshifter/SPEC-theme.md).
# Read by `theme` as template words <table>_<key>: {{shape_corner_large}}, {{state_hover}}.
# Generated once from Jetpack Compose material3 1.5.0 (Apache-2.0), tokens/*.kt in
# https://dl.google.com/android/maven2/androidx/compose/material3/material3-android/1.5.0/material3-android-1.5.0-sources.jar
# sha256 0766621e44a17f544d438458d8af5078cfa1b216492891da887ee3e6397c9e6d
# Token file versions: ShapeTokens 14_1_0, ElevationTokens v0_103, ExpressiveMotionTokens v0_14_0, MotionTokens v0_103, StateTokens v0_210, TypeScaleTokens v0_103, TypefaceTokens v0_103
# Mapped by hand: CircleShape = 9999 (fully rounded), RectangleShape = 0; FontWeight Normal,
# Medium, Bold = 400, 500, 700; type_font is IBM Plex Sans (the spec's typeface, for
# FontFamily.SansSerif). Left out: one-sided corners, CornerValue* duplicates, legacy easings,
# the Standard motion scheme's springs. Units: px at scale 1 (dp, sp), ms, opacity 0-1.

