# template (theme/templates/) -> rendered file (relative to the repo root).
# Every `out` is gitignored: palettes + templates are the source, outputs are build products.

[[target]]
template = "mango.conf"
out = "colors.conf"

[[target]]
template = "foot.ini"
out = "foot/colors.ini"

[[target]]
template = "mako"
out = "mako/colors"

[[target]]
template = "rofi.rasi"
out = "rofi/themes/colors.rasi"

[[target]]
template = "mangobar.css"
out = "mangobar/colors.css"

[[target]]
template = "wlogout.css"
out = "wlogout/colors.css"

[[target]]
template = "gtk3.css"
out = "gtk-3.0/colors.css"

[[target]]
template = "gtk4.css"
out = "gtk-4.0/colors.css"

[[target]]
template = "gtk3-settings.ini"
out = "gtk-3.0/settings.ini"

[[target]]
template = "gtk4-settings.ini"
out = "gtk-4.0/settings.ini"

[[target]]
template = "swaylock"
out = "swaylock/config"

[[target]]
template = "colors.sh"
out = "theme/colors.sh"

[[target]]
template = "swayosd.css"
out = "swayosd/colors.css"

[[target]]
template = "greeter.toml"
out = "greeter/themes/mango.toml"

[[target]]
template = "userChrome.css"
out = "firefox/userChrome.css"

[[target]]
template = "fastfetch.jsonc"
out = "fastfetch/config.jsonc"
