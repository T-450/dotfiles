# helix: VS Code's Dark+ theme (built in), diagnostics shown inline, and keys added for Vim and
# AstroNvim habits without changing helix's own (selection first: select, then act). Every added
# key was free in the keymap of helix (gj1118's 26.09.02), except four named ones:
# - Ctrl+C copies the selection to the system clipboard (helix's own Ctrl+C toggles comments, which
#   space+c also does); kitty's Ctrl+V pastes.
# - $ goes to the line end, as in Vim; the command it replaces (keep selections whose shell command
#   succeeds) moves to Alt+$.
# - Ctrl+j/k move between splits (AstroNvim); the fork's move-lines goes to Alt+j/k.
# - space l is the LSP group (AstroNvim); the fork's search-in-file goes to space o.
# The table of every added key is in docs/apps/helix.md.
theme = "dark_plus"

[editor]
# a diagnostic at the end of its line (hints and up); warnings and errors also in full under the
# cursor's line, which leaves a half-screen tile readable elsewhere
end-of-line-diagnostics = "hint"
# gj1118's fork only (checked against 26.09.02; stock helix rejects these keys, so going back to
# it means reverting them): rounded popups and pickers, nested brackets in alternating colors
rounded-corners = true
rainbow-brackets = true

[editor.inline-diagnostics]
cursor-line = "warning"

# --- gj1118's fork only (checked against 26.09.02) ---
# who last changed the cursor's line, at its end
[editor.inline-blame]
show = "cursor-line"
# fetch it in the background as the file opens; otherwise it waits for space B
auto-fetch = true

# the file name and the symbols around the cursor (function, impl, ...) above the text; the full
# path would crowd a half-screen tile
[editor.breadcrumb]
enable = true
path = "file"

# the command line as a popup in the middle (noice.nvim style), not on the bottom line
[editor.cmdline]
style = "popup"

# file-type icons in pickers and the explorer, kind icons in completion (JetBrains Mono Nerd Font)
[icons.mime]
enabled = true

[icons.kind]
enabled = true
# --- end of fork-only options ---

[keys.normal]
C-c = "yank_to_clipboard"
# Vim motions
"$" = "goto_line_end"
"A-$" = "shell_keep_pipe"
"0" = "goto_line_start"
"^" = "goto_first_nonwhitespace"
# AstroNvim: Ctrl+h/j/k/l between splits (helix's own: Ctrl+w h/j/k/l), ]b/[b between buffers
# (helix's own: gn/gp)
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"
"]" = { b = "goto_next_buffer" }
"[" = { b = "goto_previous_buffer" }
# gj1118's fork moves lines with Ctrl+j/k; those are split navigation here, so moving lines goes to
# Alt+j/k, AstroNvim's own keys for it
A-j = "move_lines_down"
A-k = "move_lines_up"

# AstroNvim's leader groups, on space keys helix leaves free (space x stays free for gj1118's
# file tree)
[keys.normal.space]
q = ":quit"
Q = ":quit-all"
n = ":new"
# gj1118's fork searches within the file on space l, the LSP group here; it moves to space o
# (space L, its fuzzy variant, stays)
o = "local_search_grep"

[keys.normal.space.l]
a = "code_action"
r = "rename_symbol"
f = ":format"
s = "symbol_picker"
S = "workspace_symbol_picker"
d = "diagnostics_picker"
D = "workspace_diagnostics_picker"
h = "signature_help"
R = ":lsp-restart"

[keys.normal.space.u]
w = ":toggle soft-wrap.enable"
n = ":toggle line-number absolute relative"
i = ":toggle indent-guides.render"
h = ":toggle lsp.display-inlay-hints"
d = ":toggle end-of-line-diagnostics hint disable"
c = ":toggle auto-completion"
z = ":toggle whitespace.render all none"

# Terminals and lazygit in helix's working directory. mango starts them (mmsg), so they are new
# windows, not children of this terminal that it would swallow.
[keys.normal.space.t]
t = ':sh mmsg dispatch "spawn,kitty --directory $PWD" >/dev/null'
f = ':sh mmsg dispatch "spawn,kitty --class kitty-float --directory $PWD" >/dev/null'
l = ':sh mmsg dispatch "spawn,kitty --directory $PWD -e lazygit" >/dev/null'

[keys.select]
C-c = "yank_to_clipboard"
"$" = "extend_to_line_end"
"A-$" = "shell_keep_pipe"
"0" = "extend_to_line_start"
"^" = "extend_to_first_nonwhitespace"
A-j = "move_lines_down"
A-k = "move_lines_up"
