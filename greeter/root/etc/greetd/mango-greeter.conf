# The package's greeter config plus the lid rule (see greeter-panel). The package file has no binds
# on purpose; switchbind is not a key bind, so the greeter still has nothing reachable.
source=/etc/greetd/mango-greeter-config.conf

switchbind=fold,spawn,/etc/greetd/greeter-panel
switchbind=unfold,spawn,/etc/greetd/greeter-panel
