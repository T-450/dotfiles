# Mango compositor config for the greetd login screen.
# INVARIANT: never source user mango config and never define bind=/mousebind=/axisbind= lines
# (default mango binds spawn a terminal and quit). Only lid switchbind is active so closing the
# lid with an external monitor moves the login prompt to the external display.

animations=0
blur=0
shadows=0
border_radius=0
border_px=0
xwayland_persistence=0
sloppy_focus=0
warp_cursor=0
cursor_hide_timeout=2
cursor_hide_on_keypress=1

xkb_rules_layout=us

switchbind=lid:on,spawn,/etc/greetd/greeter-panel
switchbind=lid:off,spawn,/etc/greetd/greeter-panel
