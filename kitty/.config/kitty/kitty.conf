# kitty, the terminal (alt+return). Colors: colors.conf, rendered from the active palette by theme;
# `theme set` reloads every open window (kitty/reload.sh sends SIGUSR1).
include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        12.0
undercurl_style  thin-sparse

window_padding_width  12 14
hide_window_decorations yes
placement_strategy    top-left
confirm_os_window_close 0

cursor_shape          block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail          3
cursor_trail_decay    0.1 0.3

scrollback_lines 10000
mouse_hide_wait  -1
url_style        curly
open_url_with    default

enable_audio_bell    no
window_alert_on_bell yes

# GUI-style clipboard: select, then Ctrl+C copies (and clears the selection, so the next Ctrl+C
# interrupts again); with no selection Ctrl+C is ^C as always. Ctrl+V pastes; a literal ^V
# (vim block select, zsh quoted-insert) moves to Ctrl+Shift+Alt+V. Selecting also fills the
# primary selection (middle click), as in every other app.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+alt+v send_text all \x16

# tabs (ctrl+shift+t) as powerline segments, like the bar; hidden while there is only one
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_bar_margin_height 4.0 0.0
tab_title_template    " {index} {title} "
active_tab_font_style bold
