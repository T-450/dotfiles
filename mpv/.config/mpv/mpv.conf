# mpv. UI: uosc + thumbfast (mpv/packages). AUR mpv-uosc installs under /usr/share/mpv, which mpv
# does not search (only ~/.config/mpv and /etc/mpv), so the script and its fonts are named here.
script=/usr/share/mpv/scripts/uosc
osd-fonts-dir=/usr/share/mpv/fonts
osd-bar=no
osd-font='Inter'

# video: gpu-next is the default output. auto picks VA-API on this Comet Lake GPU (H.264, HEVC,
# VP9 in hardware; AV1 only in software, so streams below skip it)
hwdec=auto
ytdl-format=bestvideo[height<=?1080][vcodec!^=av01]+bestaudio/best[height<=?1080]

# playback
save-position-on-quit=yes
keep-open=yes
slang=en,eng
sub-auto=fuzzy

# screenshots (s) next to the desktop's own (screenshot/)
screenshot-dir=~/Pictures/Screenshots
screenshot-format=png
screenshot-template=mpv-%F-%P
