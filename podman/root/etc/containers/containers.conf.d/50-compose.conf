# `docker compose` (podman-docker) and `podman compose` hand off to an external provider. Pin it by
# absolute path: podman otherwise prefers a docker-compose found on PATH or in Docker's CLI plugin
# directories, which a GUI's onboarding (Podman Desktop) or another tool could drop in silently.
# The banner podman prints on every compose call is turned off.
[engine]
compose_providers = ["/usr/bin/podman-compose"]
compose_warning_logs = false
