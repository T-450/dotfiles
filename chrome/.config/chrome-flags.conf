# Read by the AUR package's launcher (/usr/bin/google-chrome-stable), one flag per line; a browser
# started by its binary directly (notebooklm-mcp's Patchright) doesn't see these.
# Native Wayland in a Wayland session, X11 otherwise.
--ozone-platform-hint=auto
# VA-API video decode and encode on the T14's UHD 620 (intel-media-driver, thinkpad/packages).
# Chrome 143+ form, per the Arch wiki; at most one --enable-features line.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoEncoder
