# /etc/ufw/ufw.conf
#
# The repo turns ufw on (ENABLED=yes); Arch ships ENABLED=no, so ufw.service (enabled by
# base/setup.sh) would load no rules. Arch's /etc/default/ufw already drops incoming and allows
# outgoing traffic. Published container ports (rootless Podman) are filtered like any other port.

# Set to yes to start on boot. If setting this remotely, be sure to add a rule
# to allow your remote connection before starting ufw. Eg: 'ufw allow 22/tcp'
ENABLED=yes

# Please use the 'ufw' command to set the loglevel. Eg: 'ufw logging medium'.
# See 'man ufw' for details.
LOGLEVEL=low
