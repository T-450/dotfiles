# The virtual console's keymap and font (base/), read by systemd-vconsole-setup and embedded in the
# initramfs by mkinitcpio's keymap and consolefont hooks (plymouth/'s HOOKS): without FONT the
# consolefont hook warns "no font found in configuration". The XKB lines are localectl's X11 layout.
FONT=default8x16
KEYMAP=us
XKBLAYOUT=us
XKBMODEL=pc105+inet
XKBOPTIONS=terminate:ctrl_alt_bksp
