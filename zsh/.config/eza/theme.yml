# eza (the `ls` alias in .zshrc): one icon family, eza's own filled Font Awesome file and folder
# shapes, so a listing reads as shapes, not logos. Colour lives only in the icon, as an ANSI name,
# so it follows the palette through the terminal; names stay plain (eza's bold underlined README
# too). An entry here also wins over LS_COLORS, which would otherwise colour and bolden the same
# names. The plain entries cover every name in eza 0.23.5's icon tables (src/output/icons.rs) that
# would draw a logo.
filekinds:
  directory: {foreground: Blue}

extensions:
  # source code
  "c": {filename: {foreground: Default}, icon: {glyph: "", style: {foreground: Blue}}}
  "h": {filename: {foreground: Default}, icon: {glyph: "", style: {foreground: Blue}}}
