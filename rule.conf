# Window Rules

# portal / file dialogs
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk
window_rule=animation_type_open:zoom,app_id:xdg-desktop-portal-gtk

# polkit agent
window_rule=is_floating:1,app_id:polkit-gnome-authentication-agent-1

# bluetooth manager
window_rule=is_floating:1,width:1200,height:800,app_id:blueman-manager

# launcher
window_rule=is_floating:1,no_border:1,app_id:Rofi
window_rule=animation_type_open:slide,animation_type_close:zoom,app_id:Rofi

# terminal
window_rule=is_term:1,app_id:foot
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^foot$

# browser: only honours tiling size when (fake) maximized
window_rule=force_fake_maximize:1,app_id:firefox
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^firefox$
window_rule=force_fake_maximize:1,app_id:org.qutebrowser.qutebrowser

window_rule=no_swallow:1,title:Event Tester

# layer rules
layer_rule=no_blur:1,no_animation:1,layer_name:selection
layer_rule=no_blur:1,no_animation:1,layer_name:dimland_layer
layer_rule=no_shadow:1,layer_name:notifications
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:notifications
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:swayosd
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:logout_dialog
layer_rule=no_shadow:1,layer_name:mangobar
layer_rule=no_shadow:1,layer_name:mangobar-menu
