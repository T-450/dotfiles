# foot — VS Code Dark 2026 (terminal.* colors; ANSI = VS Code defaults)

[main]
font=JetBrainsMono Nerd Font:size=12
pad=14x12
initial-window-size-chars=110x32
selection-target=clipboard

[bell]
urgent=yes

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
foreground=cccccc
background=191a1b
selection-foreground=ffffff
selection-background=297aa0
cursor=191a1b bfbfbf
urls=48a0c7
regular0=000000
regular1=cd3131
regular2=0dbc79
regular3=e5e510
regular4=2472c8
regular5=bc3fbc
regular6=11a8cd
regular7=e5e5e5
bright0=666666
bright1=f14c4c
bright2=23d18b
bright3=f5f543
bright4=3b8eea
bright5=d670d6
bright6=29b8db
bright7=e5e5e5
