# foot. Colors come from the active palette: theme/templates/foot.ini -> colors.ini

[main]
include=~/.config/foot/colors.ini
font=JetBrainsMono Nerd Font:size=12
pad=14x12
initial-window-size-chars=110x32
selection-target=clipboard

[bell]
urgent=yes

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

